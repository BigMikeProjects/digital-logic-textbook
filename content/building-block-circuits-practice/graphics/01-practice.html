<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Blocks from Verilog — Practice Set</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
    body { display: flex; align-items: center; justify-content: center; }
    .viewport-container { width: 100%; max-width: 100vw; aspect-ratio: 16/9;
        max-height: 100vh; position: relative; overflow: hidden; }
    .design-surface { width: 1920px; height: 1080px; position: absolute; top: 0; left: 0;
        transform-origin: top left; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #e0e0e0; padding: 24px 52px; display: flex; flex-direction: column; }

    /* tokens: cyan #4fc3f7 logic-1 / revealed answer · amber #ffb74d inputs + hints · violet #b388ff don't-care X + K-map loop
       · navy #0d1b2a panels · logic-0 #7d9bb5 · right #66bb6a · wrong #ef5350 */

    .topbar { display: flex; align-items: center; gap: 28px; }
    .anchor-sym { flex-shrink: 0; border: 2px solid #ffb74d; border-radius: 12px;
        background: rgba(255,183,77,0.06); padding: 8px 16px; }
    .anchor-sym svg { width: 178px; height: 72px; display: block; }
    .titles { flex: 1; }
    .titles h1 { color: #4fc3f7; font-size: 34px; font-weight: 700; }
    .titles h1 .sub { color: #90a4ae; font-size: 21px; font-weight: 500; }
    .titles .subtitle { color: #90a4ae; font-size: 17px; margin-top: 2px; }
    .page-count { flex-shrink: 0; color: #607d8b; font-size: 20px; font-weight: 600;
        border: 2px solid #37506a; border-radius: 10px; padding: 8px 18px; }
    .page-count b { color: #4fc3f7; font-size: 26px; }

    .tabstrip { display: flex; gap: 12px; margin: 12px 0 2px; }
    .tab { flex: 1; display: flex; align-items: center; gap: 11px; position: relative;
        border: 2px solid #24384c; border-radius: 12px; padding: 9px 16px;
        color: #6a8398; transition: all .12s ease; cursor: pointer; }
    .tab .tnum { width: 36px; height: 36px; flex-shrink: 0; border: 2px solid currentColor;
        border-radius: 9px; display: flex; align-items: center; justify-content: center;
        font-size: 19px; font-weight: 700; }
    .tab .tlabel { font-size: 18px; font-weight: 700; line-height: 1.15; }
    .tab .tlabel small { display: block; font-size: 13px; font-weight: 500; color: #607d8b; }
    .tab.on { color: #4fc3f7; border-color: #4fc3f7; background: rgba(79,195,247,0.08); }
    .tab.on .tnum { background: #4fc3f7; color: #0d1b2a; border-color: #4fc3f7; }
    .tab .tdone { position: absolute; bottom: 5px; right: 12px; font-size: 13px; font-weight: 700; color: #66bb6a; display: none; }
    .tab.done .tdone { display: block; }
    .tab.seen .tdone { display: block; color: #607d8b; }

    .stage { flex: 1; position: relative; min-height: 0; margin-top: 10px; }
    .page { position: absolute; inset: 0; display: none; flex-direction: column; gap: 10px; }
    .page.active { display: flex; }
    .mono { font-family: 'Menlo','Consolas','Courier New',monospace; }
    .ov { text-decoration: overline; text-decoration-thickness: 2px; text-underline-offset: 2px; }

    .panel { background: #0d1b2a; border: 2px solid #37506a; border-radius: 14px;
        display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    .panel-head { display: flex; align-items: center; gap: 12px; padding: 7px 14px 7px 18px;
        border-bottom: 2px solid #24384c; white-space: nowrap; min-height: 46px; }
    .panel-head .ph { font-size: 19px; font-weight: 700; color: #4fc3f7; }
    .panel-head .ph .sn { color: #607d8b; margin-right: 6px; }
    .panel-head .role { font-size: 15px; color: #607d8b; overflow: hidden; text-overflow: ellipsis; }
    .panel-head .spacer { flex: 1; }

    /* ---- buttons ---- */
    .btn { cursor: pointer; user-select: none; border: 2px solid #37506a; border-radius: 999px; padding: 4px 15px;
        color: #90a4ae; font-size: 15.5px; font-weight: 700; background: #0b1622; white-space: nowrap; transition: all .12s; }
    .btn:hover { border-color: #90a4ae; color: #cfd8dc; }
    .btn .k { font-family: 'Menlo','Consolas',monospace; color: #607d8b; font-size: 13px; margin-left: 7px; font-weight: 400; }
    .btn.hint { border-color: #ffb74d; color: #ffb74d; background: rgba(255,183,77,0.08); }
    .btn.hint .k { color: #8a6a3a; }
    .btn.check { border-color: #66bb6a; color: #66bb6a; background: rgba(102,187,106,0.08); }
    .btn.check .k { color: #3f7a42; }
    .btn.show { border-color: #4a6274; color: #90a4ae; }
    .btn.final { border-color: #4fc3f7; color: #0d1b2a; background: #4fc3f7; }
    .btn.final .k { color: #1d5f7d; }
    .btn.used { opacity: 0.55; }
    .btn.big { font-size: 17px; padding: 6px 18px; }

    /* ---- page 0: the method ---- */
    .leadwrap { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .steps { display: flex; align-items: stretch; gap: 8px; }
    .step { flex: 1; border: 2px solid #37506a; border-radius: 14px; background: #0b1622; padding: 12px 15px;
        display: flex; flex-direction: column; gap: 7px; }
    .step .sn { width: 34px; height: 34px; border: 2px solid #4fc3f7; border-radius: 9px; color: #4fc3f7;
        font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .step .st { font-size: 19px; font-weight: 700; color: #cfd8dc; }
    .step .sd { font-size: 15.5px; color: #90a4ae; line-height: 1.45; flex: 1; }
    .step .sd b { color: #cfd8dc; } .step .sd .mono { color: #4fc3f7; }
    .step .sd .x { color: #b388ff; font-family: 'Menlo','Consolas',monospace; font-weight: 700; }
    .step.given { border-style: dashed; }
    .step.given .sn { border-color: #607d8b; color: #607d8b; }
    .step .tag { align-self: flex-start; font-size: 12.5px; color: #607d8b; border: 1px solid #37506a; border-radius: 999px; padding: 1px 10px; }
    .arrowcell { align-self: center; color: #4a6274; font-size: 24px; flex: 0 0 auto; }
    .leadrow { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .conv { flex: 1.15; }
    .convbody { padding: 12px 22px; display: flex; flex-direction: column; gap: 9px; font-size: 16.5px; color: #b0bec5; line-height: 1.42; }
    .convbody b { color: #cfd8dc; } .convbody .cy { color: #4fc3f7; } .convbody .x { color: #b388ff; font-weight: 700; }
    .convbody .mono { color: #4fc3f7; }
    .convbody li { margin-left: 20px; }
    .helpkey { flex: 1; }
    .helpbody { padding: 12px 20px; display: flex; flex-direction: column; gap: 10px; }
    .hrow { display: flex; align-items: center; gap: 14px; font-size: 16px; color: #b0bec5; line-height: 1.35; }
    .hrow .btn { flex: 0 0 196px; text-align: center; cursor: default; }
    .hrow b { color: #cfd8dc; }
    .cards { display: flex; gap: 12px; }
    .card { flex: 1; cursor: pointer; border: 2px solid #37506a; border-radius: 14px; background: #0b1622; padding: 10px 16px;
        display: flex; flex-direction: column; gap: 3px; transition: all .12s; }
    .card:hover { border-color: #4fc3f7; background: rgba(79,195,247,0.06); }
    .card .cn { font-size: 14px; color: #607d8b; font-weight: 700; letter-spacing: .5px; }
    .card .ct { font-size: 19px; color: #cfd8dc; font-weight: 700; }
    .card .cf { font-size: 14.5px; color: #90a4ae; }
    .card .cg { align-self: flex-start; margin-top: 4px; font-size: 13px; color: #ffb74d; border: 1px solid #6a5324; border-radius: 999px; padding: 1px 10px; }

    /* ---- problem pages ---- */
    .main { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .probpanel { flex: 0 0 560px; }
    .probbody { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 18px 12px; gap: 8px; }
    .story { font-size: 16.5px; color: #cfd8dc; line-height: 1.45; }
    .story b { color: #ffb74d; } .story .cy { color: #4fc3f7; font-weight: 700; }
    .sdbox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .sdbox svg { width: 100%; height: 100%; display: block; }
    .codes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .codes .cl { font-size: 14px; color: #607d8b; margin-right: 2px; }
    .codechip { border: 2px solid #37506a; border-radius: 9px; padding: 2px 11px; font-size: 16px; color: #cfd8dc; background: #0b1622; }
    .codechip .mono { color: #4fc3f7; font-weight: 700; }
    .find { font-size: 15.5px; color: #90a4ae; border-top: 2px solid #24384c; padding-top: 8px; line-height: 1.4; }
    .find b { color: #cfd8dc; }

    .sd-node .sdc { fill: #0d1b2a; stroke: #4a6274; stroke-width: 3; }
    .sd-node .sdname { fill: #cfd8dc; font-family: 'Segoe UI',sans-serif; font-weight: 700; text-anchor: middle; font-size: 22px; }
    .sd-node .sdenc { fill: #4fc3f7; font-family: 'Menlo','Consolas',monospace; text-anchor: middle; font-size: 19px; font-weight: 700; }
    .sd-node .sdz { fill: #607d8b; font-family: 'Menlo','Consolas',monospace; text-anchor: middle; font-size: 14px; }
    .sd-node.z1 .sdz { fill: #4fc3f7; }
    .arc { fill: none; stroke: #8fa8bd; stroke-width: 2.6; }
    .arc-l { fill: #ffb74d; font-family: 'Menlo','Consolas',monospace; font-size: 18px; font-weight: 700; text-anchor: middle;
        paint-order: stroke; stroke: #0d1b2a; stroke-width: 7px; stroke-linejoin: round; }
    .arc-l .zl { fill: #4fc3f7; }
    .resetarrow { fill: none; stroke: #607d8b; stroke-width: 2.4; }
    .resetlab { fill: #607d8b; font-family: 'Segoe UI',sans-serif; font-size: 14px; }

    .work { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
    .workgrid { flex: 1; display: flex; gap: 10px; min-height: 0; }
    .leftcol { flex: 0 0 500px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .stt { border-collapse: collapse; font-family: 'Menlo','Consolas',monospace; font-size: 18px; }
    .stt th, .stt td { border: 2px solid #37506a; padding: 0; text-align: center; color: #e0e0e0; height: 29px; }
    .stt th { background: rgba(79,195,247,0.10); color: #4fc3f7; font-size: 14px; padding: 0 6px; font-weight: 700; }
    .stt th.in { color: #ffb74d; }
    .stt th.g, .stt td.g { border-left-width: 4px; }
    .stt td.q { color: #90a4ae; width: 30px; }
    .stt td.st { color: #cfd8dc; font-family: 'Segoe UI',sans-serif; font-size: 15px; font-weight: 700; padding: 0 9px; }
    .stt tr.unused td.st { color: #b388ff; font-weight: 500; font-style: italic; }
    .stt tr.unused td.q { color: #6a5a8a; }

    .eqrow { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
    .eqrow .eqn { font-family: 'Menlo','Consolas',monospace; font-size: 20px; color: #cfd8dc; }
    .eqrow .eqn .lhs { color: #4fc3f7; font-weight: 700; } .eqrow .eqn .op { color: #ffb74d; }
    .eqrow .eqn .blank { color: #37506a; letter-spacing: 2px; }
    .eqrow .eql { margin-left: auto; font-size: 13.5px; color: #607d8b; }
    .tally { margin-top: 2px; align-self: flex-start; border: 2px solid #4fc3f7; border-radius: 999px; padding: 3px 15px; font-size: 16px; color: #4fc3f7; font-weight: 700; background: rgba(79,195,247,0.08); }
    .tally small { font-size: 13px; font-weight: 400; color: #90a4ae; margin-left: 6px; }
    .ansnote { font-size: 14.5px; color: #b0bec5; line-height: 1.65; border-left: 3px solid #37506a; padding-left: 12px; white-space: normal; }
    .ansnote b { color: #cfd8dc; }

    .kmap { display: flex; flex-direction: column; align-items: center; gap: 0; }
    .kmap .kt { font-size: 19px; font-weight: 700; color: #4fc3f7; }
    .kmap .kt small { font-size: 13px; font-weight: 400; color: #607d8b; margin-left: 6px; }
    .kmap svg { display: block; }
    .kmap .kterm { font-family: 'Menlo','Consolas',monospace; font-size: 17px; color: #90a4ae; text-align: center; min-height: 24px; }
    .kmap .kterm .op { color: #607d8b; }


    /* step cards: start empty; Show fills them */
    .toprow { flex: 0 0 auto; display: flex; gap: 10px; }
    .toprow .c0 { flex: 1.45; } .toprow .c1 { flex: 1; }
    .toprow .scard { height: 122px; }
    .scard .panel-head { padding: 6px 10px 6px 16px; min-height: 44px; gap: 8px; }
    .scard .ph { font-size: 18px; }
    .btn.sm { font-size: 14px; padding: 2px 12px; }
    .sbody { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .blank { flex: 1; display: flex; align-items: center; justify-content: center; color: #37506a; font-size: 16px; font-style: italic;
        margin: 8px; border: 2px dashed #24384c; border-radius: 10px; }
    .scard.open { border-color: #2c6a88; }
    .facts { padding: 8px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 22px; align-content: center; flex: 1; font-size: 15.5px; color: #cfd8dc; line-height: 1.35; }
    .facts .fk { display: inline-block; min-width: 72px; color: #607d8b; font-size: 13.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
    .facts .am { color: #ffb74d; } .facts .cyb { color: #4fc3f7; } .facts .vl { color: #b388ff; } .facts .mono { color: #4fc3f7; }
    .facts .big1 { font-size: 19px; }
    .c1 .facts { grid-template-columns: 1fr; }
    .tblwrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 10px; }
    .stt td.vc { width: 34px; }
    .stt td.v0 { color: #5c7189; } .stt td.v1 { color: #4fc3f7; font-weight: 700; } .stt td.vX { color: #b388ff; font-weight: 700; }
    .eqwrap { flex: 1; min-height: 0; padding: 8px 16px; display: flex; flex-direction: column; gap: 3px; }
    .tallyrow { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    .tallyrow .tally { flex: 0 0 auto; margin: 0; }
    .tallyrow .ansnote { font-size: 13.5px; line-height: 1.6; }
    .kgrid { flex: 1; min-height: 0; padding: 6px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; align-content: center; justify-items: center; }
    .kv { font-family: 'Menlo','Consolas',monospace; }
    .kv.v0 { fill: #5c7189; } .kv.v1 { fill: #4fc3f7; font-weight: 700; } .kv.vX { fill: #b388ff; font-weight: 700; }
    .c4 { flex: 1; } .c3 { flex: 1; min-width: 0; }

    .helpbar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; background: #0d1b2a; border: 2px solid #37506a; border-radius: 14px; padding: 8px 14px; min-height: 58px; }
    .hintbox { flex: 1; min-width: 0; font-size: 16px; color: #cfd8dc; line-height: 1.35; border-left: 3px solid #6a5324; padding-left: 12px; }
    .hintbox .hl { color: #ffb74d; font-weight: 700; margin-right: 6px; }
    .hintbox .dim { color: #607d8b; }
    .hintbox .mono { color: #4fc3f7; }
    .hintbox .x { color: #b388ff; font-weight: 700; }

    .footer { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 8px; height: 30px; }
    .progress { display: flex; gap: 9px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #4a6274; }
    .dot.on { background: #4fc3f7; border-color: #4fc3f7; }
    .controls { color: #607d8b; font-size: 15px; white-space: nowrap; }
    .controls .k { display: inline-block; color: #90a4ae; border: 1px solid #37506a; border-radius: 6px; padding: 1px 8px;
        margin: 0 2px; font-size: 14px; font-family: 'Menlo','Consolas','Courier New',monospace; }
    .controls .k.amber { color: #ffb74d; border-color: #6a5324; }
    .controls .k.green { color: #66bb6a; border-color: #3f7a42; }
    .controls .k.cy { color: #4fc3f7; border-color: #2c6a88; }

    /* ---- one-hot additions ---- */
    .midrow { display: flex; gap: 10px; min-height: 0; }
    .midrow .scard { flex: 1; min-width: 0; }
    .c4 { flex: 1; }
    .arc.lb, .arc-l.lb { display: none; }
    .showlb .arc.lb { display: inline; stroke: #b388ff; stroke-dasharray: 8 6; }
    .showlb .arc-l.lb { display: inline; fill: #b388ff; }
    .codechip.lbkey { color: #b388ff; border-style: dashed; border-color: #6a4fa0; }
    .facts.one { grid-template-columns: 1fr; }
    .pats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; }
    .pat .mono { color: #4fc3f7; font-weight: 700; }
    .ltab { border-collapse: collapse; font-size: 15.5px; }
    .ltab th { border-bottom: 2px solid #37506a; padding: 3px 12px; color: #4fc3f7; font-size: 13.5px; text-align: left; }
    .ltab td { border-bottom: 1px solid #24384c; padding: 4px 12px; color: #cfd8dc; height: 30px; }
    .ltab td.st { font-weight: 700; color: #cfd8dc; }
    .ltab td.lbneed { color: #b388ff; font-weight: 700; } .ltab td.lbnone { color: #607d8b; font-style: italic; }
    .ltab td.arr { font-size: 15px; }
    .ltab td.dk { color: #4fc3f7; font-family: 'Menlo','Consolas',monospace; font-weight: 700; }
    .pat .qk { color: #607d8b; font-size: 13px; }
    .eqcols { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 26px; }
    .eqcols .eqrow .eqn { font-size: 19px; }
    .eqcols .eqrow .eqn sub { font-size: 13px; }

    /* ---- building blocks from Verilog ---- */
    .vpanel { flex: 0 0 600px; }
    .vcode { flex: 1; min-height: 0; margin: 0; padding: 18px 20px; background: #0b1622; border: 2px solid #24384c; border-radius: 10px;
        font-family: 'Menlo','Consolas',monospace; font-size: 18px; line-height: 1.55; color: #e0e0e0; white-space: pre; overflow: hidden; }
    .vcode .vkw { color: #4fc3f7; font-weight: 700; } .vcode .vnum { color: #ffb74d; }
    .mono2 { font-family: 'Menlo','Consolas',monospace; }
    .ltab td.cyv { color: #4fc3f7; font-weight: 700; } .ltab th.cyb, .cyb { color: #4fc3f7; }
    .ltab td.gap, .ltab th.gap { color: #607d8b; padding: 4px 4px; }
    .ltab .dec { color: #607d8b; font-weight: 400; font-size: 13px; }
    .cnote { margin-top: 8px; font-size: 14px; color: #90a4ae; text-align: center; }
    .tblwrap { flex-direction: column; }
    .ctext.big { font-size: 16.5px; line-height: 1.5; padding: 10px 18px; }
    .ctext.big .mono { color: #4fc3f7; font-weight: 700; }
    .namebox { padding: 10px 18px; display: flex; flex-direction: column; gap: 6px; }
    .bname { font-size: 24px; font-weight: 700; color: #4fc3f7; }
    .bdetail { font-size: 16.5px; color: #cfd8dc; }
    .namebox .ansnote { font-size: 14.5px; }
    .toprow .scard { height: 236px; }
    .midrow { flex: 0 0 290px; }
    .zv { color: #b388ff; font-weight: 700; } .xv { color: #ef9a9a; }
</style>
</head>
<body>
<div class="viewport-container" id="viewportContainer">
<div class="design-surface" id="designSurface">

    <div class="topbar">
        <div class="anchor-sym">
            <svg viewBox="0 0 258 104" fill="none">
                <text x="16" y="34" font-family="Menlo,monospace" font-size="17" fill="#4fc3f7">module m?</text>
                <text x="16" y="60" font-family="Menlo,monospace" font-size="17" fill="#cfd8dc">assign y =</text>
                <text x="16" y="86" font-family="Menlo,monospace" font-size="17" fill="#ffb74d">  c ? b : a;</text>
                <text x="222" y="70" font-family="'Segoe UI',sans-serif" font-size="40" font-weight="700" fill="#ffb74d">?</text>
            </svg>
        </div>
        <div class="titles">
            <h1>Building Blocks from Verilog <span class="sub">&mdash; practice set</span></h1>
            <div class="subtitle">Six mystery modules with neutral port names &middot; read the code, try some inputs, state the rule, name the block</div>
        </div>
        <div class="page-count">Page <b id="pcNum">0</b> of 0&ndash;6</div>
    </div>

    <div class="tabstrip" id="tabstrip"></div>
    <div class="stage" id="stage"></div>

    <div class="footer">
        <div class="progress" id="progress"></div>
        <div class="controls">
            <span class="k">0</span>&ndash;<span class="k">6</span> page
            &middot; each step card: <span class="k amber">Hint</span> a nudge &middot; <span class="k">Show</span> the worked step
            &middot; <span class="k amber">H</span> next hint, in order
            &middot; <span class="k cy">F</span> final answer
            &middot; <span class="k">R</span> &#8634; clear this problem
        </div>
    </div>

</div>
</div>

<script>
    // ============ RESPONSIVE SCALE ============
    const DESIGN_WIDTH = 1920, DESIGN_HEIGHT = 1080;
    function autoResize() {
        const c = document.getElementById('viewportContainer');
        const s = document.getElementById('designSurface');
        const vw = window.innerWidth, vh = window.innerHeight;
        let cw, ch;
        if (vw / vh > 16/9) { ch = vh; cw = ch*(16/9); } else { cw = vw; ch = cw*(9/16); }
        c.style.width = cw+'px'; c.style.height = ch+'px';
        s.style.transform = `scale(${cw/DESIGN_WIDTH})`;
    }
    autoResize();
    let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(autoResize,50); });
    window.addEventListener('orientationchange', () => setTimeout(autoResize,100));
    const SVGNS = 'http://www.w3.org/2000/svg';

    // ============ THE SIX MODULES (source of truth) ============
    // VERILOG[name] is the exact text that was simulated exhaustively in iverilog (spliced in at build time;
    // selftest.js compares it, and every rule row below, against the iverilog truth tables).
    // ins / outs: [name, width]. rules: the answer table for Step 3 — pred(x) picks the inputs a row covers,
    // f(x) gives the outputs; the rows partition the input space (self-tested). probes: Step 2's chosen inputs.
    const VERILOG = {"m1": "module m1 (input      [1:0] s,\n           input            a, b, c, d,\n           output reg       y);\n  always @*\n    case (s)\n      2'b00: y = a;\n      2'b01: y = b;\n      2'b10: y = c;\n      2'b11: y = d;\n    endcase\nendmodule", "m2": "module m2 (input      [1:0] k,\n           input            g,\n           output reg [3:0] z);\n  always @* begin\n    z = 4'b0000;\n    if (g)\n      case (k)\n        2'b00: z = 4'b0001;\n        2'b01: z = 4'b0010;\n        2'b10: z = 4'b0100;\n        2'b11: z = 4'b1000;\n      endcase\n  end\nendmodule", "m3": "module m3 (input  [3:0] a,\n           input        t,\n           output [3:0] y);\n  assign y = t ? a : 4'bzzzz;\nendmodule", "m4": "module m4 (input      [3:0] r,\n           output reg [1:0] n,\n           output reg       v);\n  always @*\n    casez (r)\n      4'b1???: begin n = 2'd3; v = 1'b1; end\n      4'b01??: begin n = 2'd2; v = 1'b1; end\n      4'b001?: begin n = 2'd1; v = 1'b1; end\n      4'b0001: begin n = 2'd0; v = 1'b1; end\n      default: begin n = 2'd0; v = 1'b0; end\n    endcase\nendmodule", "m5": "module m5 (input            clk,\n           input            w,\n           input      [3:0] d,\n           output reg [3:0] q);\n  always @(posedge clk)\n    if (w) q <= d;\nendmodule", "m6": "module m6 (input      [3:0] a, b,\n           output reg       f, g, h);\n  always @* begin\n    f = 1'b0;  g = 1'b0;  h = 1'b0;\n    if      (a > b)  f = 1'b1;\n    else if (a == b) g = 1'b1;\n    else             h = 1'b1;\n  end\nendmodule"};
    const PROBS = [
        {
            mod: 'm1', title: 'Module m1', tag: 'Warm-up', short: '6 inputs · 1 output',
            ins: [['s', 2], ['a', 1], ['b', 1], ['c', 1], ['d', 1]], outs: [['y', 1]],
            read: 'A <span class="mono">case</span> on s. Each value of s copies one of the inputs a, b, c or d to y.',
            probes: [{ s: 0, a: 1, b: 0, c: 0, d: 0 }, { s: 1, a: 1, b: 0, c: 0, d: 0 }, { s: 1, a: 0, b: 1, c: 0, d: 0 }, { s: 3, a: 0, b: 0, c: 0, d: 1 }],
            rules: [
                { when: 's = 00', out: 'y = a', pred: x => x.s === 0, f: x => ({ y: x.a }) },
                { when: 's = 01', out: 'y = b', pred: x => x.s === 1, f: x => ({ y: x.b }) },
                { when: 's = 10', out: 'y = c', pred: x => x.s === 2, f: x => ({ y: x.c }) },
                { when: 's = 11', out: 'y = d', pred: x => x.s === 3, f: x => ({ y: x.d }) },
            ],
            hints: [
                'Each line of the <span class="mono">case</span> says &ldquo;when s has this value, y equals this input&rdquo;.',
                'Set a = 1 and the others 0, then change only s. Then put the 1 on b instead.',
                'y always equals one of four inputs. Which input decides which one?',
            ],
            name: '4-to-1 multiplexer',
            detail: 's is the 2-bit select; a, b, c, d are the data inputs.',
            note: 'A <span class="mono">case</span> with one data input per line is the signature of a multiplexer.',
        },
        {
            mod: 'm2', title: 'Module m2', tag: 'Enable', short: '3 input bits · 4 outputs',
            ins: [['k', 2], ['g', 1]], outs: [['z', 4]],
            read: 'z starts at <span class="mono">0000</span>. Only when g is 1 does the <span class="mono">case</span> run, setting exactly one bit of z, chosen by k.',
            probes: [{ k: 0, g: 1 }, { k: 2, g: 1 }, { k: 3, g: 1 }, { k: 2, g: 0 }],
            rules: [
                { when: 'g = 0', out: 'z = 0000', pred: x => x.g === 0, f: () => ({ z: 0 }) },
                { when: 'g = 1, k = 00', out: 'z = 0001', pred: x => x.g === 1 && x.k === 0, f: () => ({ z: 1 }) },
                { when: 'g = 1, k = 01', out: 'z = 0010', pred: x => x.g === 1 && x.k === 1, f: () => ({ z: 2 }) },
                { when: 'g = 1, k = 10', out: 'z = 0100', pred: x => x.g === 1 && x.k === 2, f: () => ({ z: 4 }) },
                { when: 'g = 1, k = 11', out: 'z = 1000', pred: x => x.g === 1 && x.k === 3, f: () => ({ z: 8 }) },
            ],
            hints: [
                'Every output pattern in the <span class="mono">case</span> has exactly one 1. What does the <span class="mono">if (g)</span> in front of it do?',
                'Try g = 1 with k = 0, 1, 2 and 3, then try g = 0.',
                'With g = 1, k picks which single output is 1. With g = 0, none is.',
            ],
            name: '2-to-4 decoder with an active-high enable',
            detail: 'k selects which output is 1; g is the enable.',
            note: 'Two inputs in, four outputs out, exactly one of them 1: a decoder. The <span class="mono">if (g)</span> is its enable.',
        },
        {
            mod: 'm3', title: 'Module m3', tag: 'High-Z', short: '5 input bits · 4 outputs',
            ins: [['a', 4], ['t', 1]], outs: [['y', 4]],
            read: 'One assignment. When t is 1, y gets a. When t is 0, y gets <span class="mono">4\'bzzzz</span>, the high-impedance value: the outputs let go of the wires.',
            probes: [{ a: 10, t: 0 }, { a: 10, t: 1 }, { a: 6, t: 0 }, { a: 6, t: 1 }],
            rules: [
                { when: 't = 0', out: 'y = zzzz (high impedance)', pred: x => x.t === 0, f: () => ({ y: 'zzzz' }) },
                { when: 't = 1', out: 'y = a', pred: x => x.t === 1, f: x => ({ y: x.a }) },
            ],
            hints: [
                '<span class="mono">z</span> is not 0 or 1. It means &ldquo;not driving&rdquo;: the output is disconnected from the wire.',
                'Try a = 1010 with t = 0, then with t = 1.',
                'One value of t passes a through; the other disconnects the output. Which value drives?',
            ],
            name: '4-bit tri-state buffer with an enable',
            detail: 't = 1 drives y with a; t = 0 puts all four outputs in high impedance (z).',
            note: 'Any part that can output <span class="mono">z</span> is a tri-state buffer. t is its enable: the outputs are driven only while t is 1.',
        },
        {
            mod: 'm4', title: 'Module m4', tag: 'Wildcards', short: '4 inputs · 3 output bits',
            ins: [['r', 4]], outs: [['n', 2], ['v', 1]],
            read: 'A <span class="mono">casez</span> on r, where <span class="mono">?</span> means &ldquo;either value&rdquo;. The lines are checked from the top and the first match wins; <span class="mono">default</span> catches r = 0000.',
            probes: [{ r: 6 }, { r: 2 }, { r: 9 }, { r: 1 }, { r: 0 }],
            rules: [
                { when: 'r = 1???', out: 'n = 11, v = 1', pred: x => (x.r & 8) !== 0, f: () => ({ n: 3, v: 1 }) },
                { when: 'r = 01??', out: 'n = 10, v = 1', pred: x => (x.r & 12) === 4, f: () => ({ n: 2, v: 1 }) },
                { when: 'r = 001?', out: 'n = 01, v = 1', pred: x => (x.r & 14) === 2, f: () => ({ n: 1, v: 1 }) },
                { when: 'r = 0001', out: 'n = 00, v = 1', pred: x => x.r === 1, f: () => ({ n: 0, v: 1 }) },
                { when: 'r = 0000', out: 'n = 00, v = 0', pred: x => x.r === 0, f: () => ({ n: 0, v: 0 }) },
            ],
            hints: [
                'In <span class="mono">4\'b01??</span> the <span class="mono">?</span> bits can be anything. Read each line as &ldquo;the highest 1 is in this position&rdquo;.',
                'Try r = 0110 and r = 0010. Then try r = 0001 and r = 0000: n is 00 for both, so look at v.',
                'n is the index of the highest-numbered 1 in r. v says whether r had any 1 at all.',
            ],
            name: '4-to-2 priority encoder with a valid output',
            detail: 'n is the index of the highest-numbered 1 in r; v = 1 when any input is 1.',
            note: 'Ignoring every bit below the highest 1 is what makes it a priority encoder. v is the only thing that tells r = 0001 apart from r = 0000.',
        },
        {
            mod: 'm5', title: 'Module m5', tag: 'Clocked', short: 'clock + 5 input bits · 4 outputs', seq: true,
            clk: 'clk', ins: [['w', 1], ['d', 4]], outs: [['q', 4]],
            read: '<span class="mono">always @(posedge clk)</span> runs only at a rising edge of clk. If w is 1, q takes d. There is no <span class="mono">else</span>: when w is 0, q is not assigned, so it keeps its value.',
            seqProbes: [{ w: 1, d: 5 }, { w: 0, d: 15 }, { w: 1, d: 12 }, { w: 0, d: 3 }],
            rules: [
                { when: 'rising edge of clk, w = 1', out: 'q &larr; d' },
                { when: 'rising edge of clk, w = 0', out: 'q keeps its value' },
                { when: 'between edges', out: 'q keeps its value' },
            ],
            step: (q, x) => x.w ? bits(x.d, 4) : q,
            hints: [
                '<span class="mono">posedge clk</span> means the block acts only at a rising clock edge. Between edges, q cannot change.',
                'Step through four rising edges: w = 1 with d = 0101, then w = 0 with d = 1111, then w = 1 with d = 1100, then w = 0.',
                'At each rising edge there are two cases, depending on w. What happens to q when nothing assigns it?',
            ],
            name: '4-bit register with a load enable',
            detail: 'At each rising edge of clk, w = 1 loads d into q and w = 0 holds q. q changes only at clock edges.',
            note: 'The only module here with memory: four D flip-flops on one clock, plus a load enable. The giveaway is <span class="mono">posedge</span>.',
        },
        {
            mod: 'm6', title: 'Module m6', tag: 'Relational', short: '8 input bits · 3 outputs',
            ins: [['a', 4], ['b', 4]], outs: [['f', 1], ['g', 1], ['h', 1]], dec: true,
            read: 'All three outputs start at 0. The if&ndash;else chain then sets exactly one of them: f when a &gt; b, g when a = b, and h otherwise.',
            probes: [{ a: 5, b: 3 }, { a: 3, b: 5 }, { a: 4, b: 4 }, { a: 0, b: 15 }],
            rules: [
                { when: 'a &gt; b', out: 'f = 1, g = 0, h = 0', pred: x => x.a > x.b, f: () => ({ f: 1, g: 0, h: 0 }) },
                { when: 'a = b', out: 'f = 0, g = 1, h = 0', pred: x => x.a === x.b, f: () => ({ f: 0, g: 1, h: 0 }) },
                { when: 'a &lt; b', out: 'f = 0, g = 0, h = 1', pred: x => x.a < x.b, f: () => ({ f: 0, g: 0, h: 1 }) },
            ],
            hints: [
                'The tests compare a and b as whole 4-bit numbers. What is left for the final <span class="mono">else</span>?',
                'Try a = 5, b = 3; then a = 3, b = 5; then a = 4, b = 4.',
                'Exactly one output is 1 for every input. Each one answers a different question about a and b.',
            ],
            name: '4-bit magnitude comparator (unsigned)',
            detail: 'f = 1 when a &gt; b, g = 1 when a = b, h = 1 when a &lt; b.',
            note: 'Two numbers in and three one-hot outputs reporting greater, equal or less: a magnitude comparator.',
        },
    ];
    const NPROB = PROBS.length;

    // ============ DERIVED FACTS ============
    const bits = (v, n) => v.toString(2).padStart(n, '0');
    PROBS.forEach(P => { P.v = VERILOG[P.mod]; P.nin = P.ins.reduce((a, p) => a + p[1], 0); });
    const toBits = (v, w) => typeof v === 'string' ? v : bits(v, w);
    const fmt = (P, name, w, val) => { const t = toBits(val, w); const cls = /z/.test(t) ? 'zv' : /x/.test(t) ? 'xv' : '';
        return `<span class="${cls}">${t}</span>` + (P.dec && typeof val === 'number' ? ` <span class="dec">(${val})</span>` : ''); };
    function trace(P, seq) { let q = 'xxxx'; const t = [q]; seq.forEach(x => { q = P.step(q, x); t.push(q); }); return t; }
    const evalRules = (P, x) => { const r = P.rules.find(r => r.pred && r.pred(x)); return r ? r.f(x) : null; };

    // ============ VERILOG DISPLAY ============
    const KW = /\b(module|endmodule|input|output|reg|wire|assign|always|begin|end|if|else|case|endcase|casez|default|posedge|negedge)\b/g;
    function hiVerilog(src) {
        const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return src.split('\n').map(line => {
            let h = esc(line);
            h = h.replace(/(\d+'[bdh][0-9a-fA-F_?]+)/g, '<span class="vnum">$1</span>');
            h = h.replace(KW, '<span class="vkw">$1</span>');
            h = h.replace(/(@\*)/g, '<span class="vkw">$1</span>');
            return h;
        }).join('\n');
    }

    // ============ STEP CARDS ============
    const STEPS = [
        { n: 0, title: 'Understand the problem' },
        { n: 1, title: 'Read the body' },
        { n: 2, title: 'Try some inputs' },
        { n: 3, title: 'State the rule' },
        { n: 4, title: 'Name the block' },
    ];
    function stepHint(P, n) {
        if (n === 0) return 'List every port with its direction and width, and count the input bits: that tells you how many rows a full truth table would need.';
        if (n === 4) return 'Match your rule to a building block: multiplexer, decoder, priority encoder, tri-state buffer, comparator, or a register built from D flip-flops. Give its size and say what each port does.';
        return P.hints[n - 1];
    }
    const blankST = () => ({ hint: [false, false, false, false, false], shown: [false, false, false, false, false], lastHint: -1 });
    const ST = PROBS.map(blankST);
    let page = 0;
    function nextHelp(pi) {
        const s = ST[pi];
        for (let n = 0; n < 5; n++) { if (!s.hint[n] && !s.shown[n]) return { kind: 'hint', n }; if (!s.shown[n]) return { kind: 'show', n }; }
        return null;
    }

    // ============ PAGE BUILD ============
    const stage = document.getElementById('stage');
    const tabstrip = document.getElementById('tabstrip'), progress = document.getElementById('progress');
    const TABS = [{ n: 0, label: 'How to Work a Problem', small: 'the steps + the buttons' }].concat(PROBS.map((P, i) => ({ n: i + 1, label: P.title, small: P.tag })));
    TABS.forEach(t => {
        const d = document.createElement('div'); d.className = 'tab'; d.dataset.page = t.n;
        d.innerHTML = `<div class="tnum">${t.n}</div><div class="tlabel">${t.label}<small>${t.small}</small></div><div class="tdone"></div>`;
        tabstrip.appendChild(d);
        const dot = document.createElement('div'); dot.className = 'dot'; dot.dataset.dot = t.n; progress.appendChild(dot);
    });
    const pages = [];
    function mkPage(id, inner) { const p = document.createElement('div'); p.className = 'page'; p.id = 'p' + id; p.innerHTML = inner; stage.appendChild(p); pages.push(p); return p; }

    mkPage(0, `
      <div class="leadwrap">
        <div class="steps">
          <div class="step"><div class="sn">0</div><div class="st">Understand the problem</div>
            <div class="sd">List the <b>ports</b>: name, direction, width. The names are deliberately neutral, so the port list tells you <b>sizes</b>, not roles. Count the input bits.</div></div>
          <div class="arrowcell">&rarr;</div>
          <div class="step"><div class="sn">1</div><div class="st">Read the body</div>
            <div class="sd">Say in words what each statement does: a <span class="mono">case</span> line, an if&ndash;else, an <span class="mono">always @*</span> block or one triggered by <span class="mono">posedge</span>. Watch for <span class="mono">?</span> and <span class="mono">z</span> in constants and for the conditional operator <span class="mono">?:</span>.</div></div>
          <div class="arrowcell">&rarr;</div>
          <div class="step"><div class="sn">2</div><div class="st">Try some inputs</div>
            <div class="sd">Pick a few input values and work out the outputs by hand, changing <b>one</b> input at a time. For a clocked module, step through a few clock edges instead.</div></div>
          <div class="arrowcell">&rarr;</div>
          <div class="step"><div class="sn">3</div><div class="st">State the rule</div>
            <div class="sd">Turn the examples into a rule that covers <b>every</b> input: a short table, with <span class="mono">?</span> for &ldquo;either value&rdquo;. For a clocked module, say what happens at an edge and between edges.</div></div>
          <div class="arrowcell">&rarr;</div>
          <div class="step"><div class="sn">4</div><div class="st">Name the block</div>
            <div class="sd">Match the rule to a building block and say what each port <b>does</b>: which input selects, which enables, which is the clock, what each output reports.</div></div>
        </div>
        <div class="leadrow">
          <div class="panel conv"><div class="panel-head"><div class="ph">Conventions used in every problem</div></div>
            <div class="convbody">
              <ul>
                <li>Each module is a building block from <b data-topic="building-block-circuits">Building Block Circuits</b>, or a register built from the <b data-topic="d-flip-flop">D Flip-Flop</b>, written in its most obvious Verilog form, often a <span class="mono">case</span> statement but not always. The point is the part&rsquo;s function, not Verilog tricks. <b>Five are combinational; one is clocked.</b></li>
                <li><b>Port names are neutral</b> (<span class="mono">a</span>, <span class="mono">k</span>, <span class="mono">r</span> &hellip;) so they can&rsquo;t give the answer away. Work from what the code does.</li>
                <li>Vectors are written <b>high bit first</b>: if <span class="mono">z</span> is <span class="mono">[3:0]</span>, then <span class="mono">z = 0100</span> means z[2] = 1.</li>
                <li>Each module&rsquo;s behavior is unique, so there is one right rule. Where a block has two common names, Step 4 gives both.</li>
                <li>Every listing was simulated: the combinational ones for every input combination, the clocked one over a long sequence of clock edges. The answers come from those simulations.</li>
              </ul>
            </div>
          </div>
          <div class="panel helpkey"><div class="panel-head"><div class="ph">Getting help</div><div class="role">every step card starts empty &mdash; work it on paper first</div></div>
            <div class="helpbody">
              <div class="hrow"><span class="btn hint">Hint</span><div>On each step card: a nudge for that step, in the bar at the bottom. Nothing is filled in.</div></div>
              <div class="hrow"><span class="btn show">Show</span><div>On each step card: the worked step &mdash; the port list, a reading of the code, a few worked inputs, the rule, or the block&rsquo;s name.</div></div>
              <div class="hrow"><span class="btn hint">Next hint<span class="k">H</span></span><div>Walks through every hint and step in order, one press at a time.</div></div>
              <div class="hrow"><span class="btn final">Final answer<span class="k">F</span></span><div>Shows every step at once, ending with the name of the block.</div></div>
            </div>
          </div>
        </div>
        <div class="cards">${PROBS.map((P, i) => `<div class="card" data-goto="${i + 1}"><div class="cn">PROBLEM ${i + 1}</div><div class="ct">${P.title}</div><div class="cf">${P.short}</div><div class="cg">${P.tag}</div></div>`).join('')}</div>
      </div>`);

    const cardHTML = (id, n, extraClass) => `
        <div class="panel scard ${extraClass}" data-step="${n}">
          <div class="panel-head"><div class="ph"><span class="sn">Step ${n}</span>${STEPS[n].title}</div><div class="spacer"></div>
            <span class="btn hint sm" data-act="hint" data-n="${n}">Hint</span><span class="btn show sm" data-act="show" data-n="${n}">Show</span></div>
          <div class="sbody" id="s${id}-${n}"></div>
        </div>`;
    function probPage(pi) {
        const P = PROBS[pi], id = pi + 1;
        const p = mkPage(id, `
          <div class="main">
            <div class="panel probpanel vpanel">
              <div class="panel-head"><div class="ph"><span class="sn">Problem ${id}</span>${P.title}</div><div class="spacer"></div><div class="role">${P.seq ? 'clocked' : 'combinational'} · ${P.nin} ${P.seq ? 'data ' : ''}input bits</div></div>
              <div class="probbody">
                <div class="story">Which building block is this? Work out what each input does and what each output reports.</div>
                <pre class="vcode" id="vc${id}">${hiVerilog(P.v)}</pre>
                <div class="find">Name the block and say what every port does. Work on paper first.</div>
              </div>
            </div>
            <div class="work">
              <div class="toprow">${cardHTML(id, 0, 'c0')}${cardHTML(id, 1, 'c1')}</div>
              <div class="midrow">${cardHTML(id, 2, 'c2')}${cardHTML(id, 3, 'c3')}</div>
              ${cardHTML(id, 4, 'c4')}
            </div>
          </div>
          <div class="helpbar">
            <span class="btn hint big" data-act="next">Next hint<span class="k">H</span></span>
            <div class="hintbox" id="hint${id}"></div>
            <span class="btn final big" data-act="final">Final answer<span class="k">F</span></span>
            <span class="btn big" data-act="reset">&#8634; Clear<span class="k">R</span></span>
          </div>`);
        p.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(pi, b.dataset.act, b.dataset.n === undefined ? undefined : +b.dataset.n)));
    }
    PROBS.forEach((P, i) => probPage(i));

    // ============ WORKED STEPS ============
    function step0HTML(P) {
        const ins = P.seq ? [[P.clk, 1, 'clock']].concat(P.ins) : P.ins;
        // ports with the same width share a row, as they do in the declaration ("input a, b, c, d")
        const group = ps => ps.reduce((g, p) => { const l = g[g.length - 1]; if (l && l[1] === p[1] && !l[2] && !p[2]) l[0] += ', ' + p[0]; else g.push(p.slice()); return g; }, []);
        const row = (p, dir) => `<tr><td class="st mono2">${p[0]}</td><td>${dir}</td><td>${p[1] === 1 ? (p[0].includes(',') ? '1 bit each' : '1 bit') : `${p[1]} bits <span class="mono2">[${p[1] - 1}:0]</span>`}</td></tr>`;
        return `<div class="tblwrap"><table class="ltab"><tr><th>port</th><th>direction</th><th>width</th></tr>${group(ins).map(p => row(p, p[2] ? 'input (clock)' : 'input')).join('')}${group(P.outs).map(p => row(p, '<span class="cyb">output</span>')).join('')}</table>
            <div class="cnote">${P.seq ? `clocked by <span class="mono2">${P.clk}</span>: q also depends on what it already holds` : `${P.nin} input bits &rarr; ${1 << P.nin} input combinations`}</div></div>`;
    }
    const step1HTML = P => `<div class="ctext big">${P.read}</div>`;
    function step2HTML(P) {
        if (P.seq) {
            const t = trace(P, P.seqProbes);
            let h = `<table class="ltab"><tr><th>rising edge</th>${P.ins.map(p => `<th>${p[0]}</th>`).join('')}<th class="gap"></th><th class="cyb">q after</th></tr>`;
            h += `<tr><td class="mono2">start</td>${P.ins.map(() => '<td></td>').join('')}<td class="gap"></td><td class="mono2"><span class="xv">xxxx</span> <span class="dec">unknown</span></td></tr>`;
            P.seqProbes.forEach((x, i) => h += `<tr><td class="mono2">${i + 1}</td>${P.ins.map(p => `<td class="mono2">${fmt(P, p[0], p[1], x[p[0]])}</td>`).join('')}<td class="gap">&rarr;</td><td class="mono2 cyv">${t[i + 1]}</td></tr>`);
            return `<div class="tblwrap">${h}</table></div>`;
        }
        let h = `<table class="ltab"><tr>${P.ins.map(p => `<th>${p[0]}</th>`).join('')}<th class="gap"></th>${P.outs.map(p => `<th class="cyb">${p[0]}</th>`).join('')}</tr>`;
        P.probes.forEach(x => { const o = evalRules(P, x); h += `<tr>${P.ins.map(p => `<td class="mono2">${fmt(P, p[0], p[1], x[p[0]])}</td>`).join('')}<td class="gap">&rarr;</td>${P.outs.map(p => `<td class="mono2 cyv">${fmt(P, p[0], p[1], o[p[0]])}</td>`).join('')}</tr>`; });
        return `<div class="tblwrap">${h}</table></div>`;
    }
    function step3HTML(P) {
        let h = `<table class="ltab"><tr><th>when</th><th>outputs</th></tr>`;
        P.rules.forEach(r => h += `<tr><td class="mono2">${r.when}</td><td class="mono2 cyv">${r.out}</td></tr>`);
        return `<div class="tblwrap">${h}</table></div>`;
    }
    const step4HTML = P => `<div class="namebox"><div class="bname">${P.name}</div><div class="bdetail">${P.detail}</div><div class="ansnote">${P.note}</div></div>`;
    const STEP_HTML = [step0HTML, step1HTML, step2HTML, step3HTML, step4HTML];

    // ============ RENDER ============
    function renderProblem(pi) {
        const P = PROBS[pi], s = ST[pi], id = pi + 1, p = document.getElementById('p' + id);
        for (let n = 0; n < 5; n++) {
            const body = document.getElementById(`s${id}-${n}`), card = body.closest('.scard');
            card.classList.toggle('open', s.shown[n]);
            body.innerHTML = s.shown[n] ? STEP_HTML[n](P) : `<div class="blank">Work step ${n} on paper.</div>`;
            card.querySelector('[data-act="hint"]').classList.toggle('used', s.hint[n]);
            card.querySelector('[data-act="show"]').classList.toggle('used', s.shown[n]);
        }
        const hb = document.getElementById('hint' + id), nx = nextHelp(pi);
        const upNext = nx ? `<span class="dim">Next hint: ${nx.kind === 'hint' ? 'a nudge for' : 'the worked'} step ${nx.n}.</span>` : `<span class="dim">Every step is showing.</span>`;
        hb.innerHTML = s.lastHint >= 0 ? `<span class="hl">Step ${s.lastHint} hint</span>${stepHint(P, s.lastHint)}` :
            `<span class="dim">Every step card starts empty. Work each step on paper, then use a card&rsquo;s <b style="color:#ffb74d">Hint</b> or <b style="color:#90a4ae">Show</b>.</span> ${upNext}`;
        p.querySelector('[data-act="next"]').classList.toggle('used', !nx);
        p.querySelector('[data-act="final"]').classList.toggle('used', s.shown[4]);
        renderTabs();
    }
    function renderTabs() {
        document.querySelectorAll('.tab').forEach(t => {
            const n = +t.dataset.page; t.classList.toggle('on', n === page);
            if (n > 0) { const s = ST[n - 1]; t.classList.toggle('seen', s.shown[4]); t.querySelector('.tdone').textContent = s.shown[4] ? 'answer shown' : ''; }
        });
    }
    function act(pi, a, n) {
        const s = ST[pi];
        if (a === 'hint') { s.hint[n] = true; s.lastHint = n; }
        else if (a === 'show') { s.shown[n] = true; }
        else if (a === 'next') { const nx = nextHelp(pi); if (nx) { if (nx.kind === 'hint') { s.hint[nx.n] = true; s.lastHint = nx.n; } else s.shown[nx.n] = true; } }
        else if (a === 'final') { s.shown = [true, true, true, true, true]; }
        else if (a === 'reset') { ST[pi] = blankST(); }
        renderProblem(pi);
    }
    function render() {
        pages.forEach(p => p.classList.toggle('active', p.id === 'p' + page));
        document.querySelectorAll('.dot').forEach(d => d.classList.toggle('on', +d.dataset.dot === page));
        document.getElementById('pcNum').textContent = page;
        if (page > 0) renderProblem(page - 1); else renderTabs();
    }
    function setPage(n) { page = Math.max(0, Math.min(NPROB, n)); render(); }
    tabstrip.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setPage(+t.dataset.page)));
    document.querySelectorAll('[data-goto]').forEach(c => c.addEventListener('click', () => setPage(+c.dataset.goto)));
    document.addEventListener('keydown', (e) => {
        const k = e.key;
        if (k >= '0' && k <= String(NPROB)) { setPage(+k); e.preventDefault(); return; }
        switch (k) {
            case 'ArrowRight': setPage(page + 1); e.preventDefault(); return;
            case 'ArrowLeft': setPage(page - 1); e.preventDefault(); return;
        }
        if (page === 0) return;
        const pi = page - 1;
        switch (k.toLowerCase()) {
            case 'h': act(pi, 'next'); break;
            case 'f': act(pi, 'final'); break;
            case 'r': act(pi, 'reset'); break;
        }
    });

    // ============ SELF-TEST API ============
    window.__api = { setPage, act, getState: () => ({ page, ST }), nextHelp, stepHint, STEPS, PROBS, VERILOG, evalRules, trace, toBits };

    render();
</script>
</body>
</html>
