<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Four-variable K-map for D2, rows UP Q2 and columns Q1 Q0 in Gray order. A cyan row of four (UP-bar Q2), an amber block of four (Q2 Q1-bar), a violet block of four wrapping the outer columns (Q2 Q0-bar), and a green single cell at UP = 1, Q2 Q1 Q0 = 011 (UP Q2-bar Q1 Q0). D2 = Q2 XOR (UP Q1 Q0).">
  <style>
    svg { background: #fff; }
    text { font-family: Inter, Helvetica, Arial, sans-serif; }
    .title  { font-size: 30px; font-weight: 700; fill: #102a43; }
    .sub    { font-size: 19px; fill: #8198af; }
