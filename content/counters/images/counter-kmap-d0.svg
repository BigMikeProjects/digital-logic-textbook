<text class="hdr" x="160" y="280" text-anchor="end" font-size="20">01</text>
<text class="hdr" x="160" y="362" text-anchor="end" font-size="20">11</text>
<text class="hdr" x="160" y="444" text-anchor="end" font-size="20">10</text>
<text class="corner" x="160" y="136" text-anchor="end">UP Q2 \ Q1 Q0</text>
