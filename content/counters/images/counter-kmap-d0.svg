<text class="capsub" x="340" y="520" text-anchor="middle">rows: UP Q2 &#183; columns: Q1 Q0 &#183; both in Gray order</text>
<line x1="566" y1="130" x2="566" y2="524" stroke="#aab9c9" stroke-width="2"/>
<circle cx="604" cy="160" r="7" fill="#0aa5c4"/>
