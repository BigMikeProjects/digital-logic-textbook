<text class="val" x="299" y="285" text-anchor="middle" font-size="34">1</text>
<text class="val" x="381" y="285" text-anchor="middle" font-size="34">1</text>
<text class="val0" x="463" y="285" text-anchor="middle" font-size="34">0</text>
