<text class="hdr" x="299" y="136" text-anchor="middle" font-size="20">01</text>
<text class="hdr" x="381" y="136" text-anchor="middle" font-size="20">11</text>
<text class="hdr" x="463" y="136" text-anchor="middle" font-size="20">10</text>
