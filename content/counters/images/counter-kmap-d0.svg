<circle cx="604" cy="204" r="7" fill="#e0890b"/>
<text x="624.0" y="212.0" font-size="24" font-weight="700" fill="#e0890b">UP</text><text x="657.8" y="212.0" font-size="24" font-weight="700" fill="#e0890b">·</text><text x="666.2" y="212.0" font-size="24" font-weight="700" fill="#e0890b">Q0</text><line x1="667.7" y1="190.9" x2="697.4" y2="190.9" stroke="#e0890b" stroke-width="2.0" stroke-linecap="round"/>
<text class="capsub" x="596" y="274">read off the groups</text>
<text x="596.0" y="312.0" font-size="23" font-weight="700" fill="#102a43">D0</text><text x="634.2" y="312.0" font-size="23" font-weight="700" fill="#102a43">=</text><text x="655.3" y="312.0" font-size="23" font-weight="700" fill="#102a43">UP</text><line x1="656.7" y1="291.8" x2="685.2" y2="291.8" stroke="#102a43" stroke-width="2.0" stroke-linecap="round"/><text x="687.8" y="312.0" font-size="23" font-weight="700" fill="#102a43">·</text><text x="695.8" y="312.0" font-size="23" font-weight="700" fill="#102a43">Q0</text><text x="734.0" y="312.0" font-size="23" font-weight="700" fill="#102a43">+</text><text x="755.2" y="312.0" font-size="23" font-weight="700" fill="#102a43">UP</text><text x="787.6" y="312.0" font-size="23" font-weight="700" fill="#102a43">·</text><text x="795.6" y="312.0" font-size="23" font-weight="700" fill="#102a43">Q0</text><line x1="797.0" y1="291.8" x2="825.5" y2="291.8" stroke="#102a43" stroke-width="2.0" stroke-linecap="round"/>
<text class="capsub" x="596" y="362">which is the same as</text>
<text x="596.0" y="404.0" font-size="30" font-weight="700" fill="#102a43">D0</text><text x="645.8" y="404.0" font-size="30" font-weight="700" fill="#102a43">=</text><text x="673.4" y="404.0" font-size="30" font-weight="700" fill="#102a43">Q0</text><text x="723.2" y="404.0" font-size="30" font-weight="700" fill="#102a43">⊕</text><text x="752.6" y="404.0" font-size="30" font-weight="700" fill="#102a43">UP</text>
<text class="note" x="596" y="452">Two groups of four. The amber one wraps</text>
<text class="note" x="596" y="480">around the left and right edges.</text>
</svg>
