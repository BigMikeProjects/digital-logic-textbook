<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 664" role="img" aria-label="The three-variable map of F equal to sum m(0, 1, 4, 5, 7) with two groups drawn: an amber group of four covering m0, m1, m4 and m5, which reads as B-bar, and a violet group of two covering m5 and m7, which reads as A C. The result is F equals B-bar plus A C.">
  <style>
    svg { background: #fff; }
    text { font-family: Inter, Helvetica, Arial, sans-serif; }
    .title  { font-size: 30px; font-weight: 700; fill: #102a43; }
    .sub    { font-size: 19px; fill: #8198af; }
    .hdr    { font-size: 22px; font-weight: 700; fill: #41556b; }
    .corner { font-size: 18px; font-weight: 700; fill: #8198af; }
    .val    { font-size: 34px; font-weight: 700; fill: #102a43; }
    .val0   { font-size: 34px; font-weight: 700; fill: #b9c6d4; }
    .valx   { font-size: 34px; font-weight: 700; fill: #7e93a8; }
    .idx    { font-size: 15px; fill: #a3b2c2; }
    .note   { font-size: 19px; fill: #41556b; }
    .grid   { fill: none; stroke: #aab9c9; stroke-width: 2; }
    .gridh  { fill: none; stroke: #52677e; stroke-width: 3; }
    .frame  { fill: none; stroke: #52677e; stroke-width: 3.5; }
    .cap    { font-size: 20px; font-weight: 700; fill: #41556b; }
    .capsub { font-size: 17px; fill: #8198af; }
  </style>
<text class="title" x="36" y="52">Reading the answer off the groups</text>
<text class="sub" x="36" y="88">Cover every 1 with the fewest, largest legal groups you can. Each group becomes one product term.</text>
<line class="grid" x1="242" y1="170" x2="242" y2="354"/>
<line class="gridh" x1="334" y1="170" x2="334" y2="354"/>
<line class="grid" x1="426" y1="170" x2="426" y2="354"/>
<line class="gridh" x1="150" y1="262" x2="518" y2="262"/>
<rect class="frame" x="150" y="170" width="368" height="184"/>
<rect x="158.0" y="178.0" width="168.0" height="168.0" rx="16" fill="#e0890b" fill-opacity="0.16" stroke="#e0890b" stroke-width="4.5"/>
<rect x="266.0" y="286.0" width="136.0" height="44.0" rx="16" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="4.5"/>
<text class="hdr" x="196" y="156" text-anchor="middle" font-size="22">00</text>
<text class="hdr" x="288" y="156" text-anchor="middle" font-size="22">01</text>
<text class="hdr" x="380" y="156" text-anchor="middle" font-size="22">11</text>
<text class="hdr" x="472" y="156" text-anchor="middle" font-size="22">10</text>
<text class="hdr" x="134" y="224" text-anchor="end" font-size="22">0</text>
<text class="hdr" x="134" y="316" text-anchor="end" font-size="22">1</text>
<text class="corner" x="134" y="156" text-anchor="end">A \ BC</text>
<text class="val" x="196" y="228" text-anchor="middle" font-size="34">1</text>
<text class="idx" x="158" y="191" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">m0</text>
<text class="val" x="288" y="228" text-anchor="middle" font-size="34">1</text>
<text class="idx" x="250" y="191" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">m1</text>
<text class="val0" x="380" y="228" text-anchor="middle" font-size="34">0</text>
<text class="idx" x="342" y="191" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">m3</text>
<text class="val0" x="472" y="228" text-anchor="middle" font-size="34">0</text>
<text class="idx" x="434" y="191" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">m2</text>
<text class="val" x="196" y="320" text-anchor="middle" font-size="34">1</text>
<text class="idx" x="158" y="283" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">m4</text>
<text class="val" x="288" y="320" text-anchor="middle" font-size="34">1</text>
<text class="idx" x="250" y="283" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">m5</text>
<text class="val" x="380" y="320" text-anchor="middle" font-size="34">1</text>
<text class="idx" x="342" y="283" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">m7</text>
<text class="val0" x="472" y="320" text-anchor="middle" font-size="34">0</text>
<text class="idx" x="434" y="283" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">m6</text>
<text x="231.7" y="402.0" text-anchor="start" font-size="27" font-weight="700" fill="#e0890b">B</text><line x1="233.9" y1="380.4" x2="247.4" y2="380.4" stroke="#e0890b" stroke-width="2.0" stroke-linecap="round"/>
<text class="capsub" x="242" y="428" text-anchor="middle">group of four &#183; m0, m1, m4, m5</text>
<text x="542.0" y="304.0" text-anchor="start" font-size="27" font-weight="700" fill="#7c3aed">A</text><text x="560.4" y="304.0" text-anchor="start" font-size="27" font-weight="700" fill="#7c3aed">C</text>
<text class="capsub" x="542" y="328">group of two &#183; m5, m7</text>
<rect x="686" y="176" width="252" height="114" rx="14" fill="#f6f8fb" stroke="#52677e" stroke-width="2.5"/>
<text x="712.0" y="238.0" text-anchor="start" font-size="30" font-weight="700" fill="#102a43">F</text><text x="732.4" y="238.0" text-anchor="start" font-size="30" font-weight="700" fill="#102a43"> </text><text x="740.8" y="238.0" text-anchor="start" font-size="30" font-weight="700" fill="#102a43">=</text><text x="759.4" y="238.0" text-anchor="start" font-size="30" font-weight="700" fill="#102a43"> </text><text x="767.8" y="238.0" text-anchor="start" font-size="30" font-weight="700" fill="#102a43">B</text><line x1="770.2" y1="214.0" x2="785.2" y2="214.0" stroke="#102a43" stroke-width="2.2" stroke-linecap="round"/><text x="790.6" y="238.0" text-anchor="start" font-size="30" font-weight="700" fill="#102a43"> </text><text x="799.0" y="238.0" text-anchor="start" font-size="30" font-weight="700" fill="#102a43">+</text><text x="817.6" y="238.0" text-anchor="start" font-size="30" font-weight="700" fill="#102a43"> </text><text x="826.0" y="238.0" text-anchor="start" font-size="30" font-weight="700" fill="#102a43">A</text><text x="846.4" y="238.0" text-anchor="start" font-size="30" font-weight="700" fill="#102a43">C</text>
<text class="capsub" x="712" y="270">two terms, three literals</text>
<line x1="36" y1="452" x2="944" y2="452" stroke="#aab9c9" stroke-width="2"/>
<circle cx="44" cy="490" r="6" fill="#e0890b"/>
<text class="note" x="62" y="496">A group of four holds one variable constant, so its term keeps a single literal: B</text>
<text class="note" x="62" y="522">is 0 across the 00 and 01 columns.</text>
<circle cx="44" cy="546" r="6" fill="#7c3aed"/>
<text class="note" x="62" y="552">A group of two holds two variables constant: A = 1 and C = 1, while B varies and</text>
<text class="note" x="62" y="578">drops out.</text>
<circle cx="44" cy="602" r="6" fill="#6b7f95"/>
<text class="note" x="62" y="608">m5 belongs to both groups. Overlap is allowed, and here it is what lets the pair</text>
<text class="note" x="62" y="634">exist at all.</text>
</svg>
