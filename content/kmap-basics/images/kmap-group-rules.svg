<path d="M382,397 L448,397 L448,423 L408,423 L408,463 L382,463 Z" fill="#d23b54" fill-opacity="0.10" stroke="#d23b54" stroke-width="4" stroke-linejoin="round" stroke-dasharray="10 8"/>
<text class="hdr" x="395" y="376" text-anchor="middle" font-size="16">00</text>
<text class="hdr" x="435" y="376" text-anchor="middle" font-size="16">01</text>
