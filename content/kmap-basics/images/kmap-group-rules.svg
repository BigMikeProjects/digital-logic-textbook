<text class="cap" x="680" y="290">Overlap</text>
<text class="capsub" x="680" y="316">a cell may belong to more than</text>
<text class="capsub" x="680" y="339">one group</text>
<line class="grid" x1="110" y1="390" x2="110" y2="470"/>
<line class="gridh" x1="150" y1="390" x2="150" y2="470"/>
