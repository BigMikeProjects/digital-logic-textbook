<text class="cap" x="70" y="290">Rectangle of four</text>
<text class="capsub" x="70" y="316">1, 2, 4, 8 or 16 cells &#8212; a</text>
<text class="capsub" x="70" y="339">power of two</text>
<line class="grid" x1="415" y1="168" x2="415" y2="248"/>
<line class="gridh" x1="455" y1="168" x2="455" y2="248"/>
<line class="grid" x1="495" y1="168" x2="495" y2="248"/>
