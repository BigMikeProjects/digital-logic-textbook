<text class="hdr" x="90" y="154" text-anchor="middle" font-size="16">00</text>
<text class="hdr" x="130" y="154" text-anchor="middle" font-size="16">01</text>
<text class="hdr" x="170" y="154" text-anchor="middle" font-size="16">11</text>
<text class="hdr" x="210" y="154" text-anchor="middle" font-size="16">10</text>
<text class="hdr" x="54" y="194" text-anchor="end" font-size="16">0</text>
