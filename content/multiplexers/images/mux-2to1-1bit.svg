<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-label="Gate-level one-bit 2-to-1 multiplexer: an inverter makes S-bar, two AND gates gate D0 with S-bar and D1 with S, and an OR gate merges them into Y. An inset shows the same circuit as the trapezoidal mux symbol.">
  <style>
    svg { background: #fff; }
    .title { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #24313f; }
    .label { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 23px; fill: #24313f; }
    .sig   { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #24313f; }
    .small { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 18px; fill: #64748b; }
    .mt    { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #2563eb; }
    .wire  { fill: none; stroke: #24313f; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .gate  { fill: #fff; stroke: #24313f; stroke-width: 3.5; stroke-linejoin: round; }
    .bub   { fill: #fff; stroke: #24313f; stroke-width: 3; }
    .node  { fill: #24313f; }
    .panel { fill: none; stroke: #f97316; stroke-width: 2; stroke-dasharray: 7 6; }
  </style>
<text class="title" x="40" y="44" text-anchor="start">One bit of a 2:1 multiplexer</text><text class="small" x="40" y="74" text-anchor="start">The select line enables exactly one AND gate; the OR gate passes the live path straight through.</text><text class="sig" x="58" y="142" text-anchor="end">D0</text><path class="wire" d="M70,134 H430"/><text class="sig" x="58" y="302" text-anchor="end">D1</text><path class="wire" d="M70,294 H328 A12,12 0 0 1 352,294  H430"/><text class="sig" x="58" y="508" text-anchor="end">S</text><path class="wire" d="M70,500 H380 V346 H430"/><circle class="node" cx="150" cy="500" r="5"/><path class="wire" d="M150,500 V440 H170"/><path class="gate" d="M170,420.0 L210,440 L170,460.0 z"/><circle class="bub" cx="218" cy="440" r="8"/><path class="wire" d="M226,440 H340 V186 H430"/><text class="sig" x="354" y="426" text-anchor="start">S</text><path d="M352.0,407.52 h16.6" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><path class="gate" d="M430,108.0 h26.0 a52.0,52.0 0 0 1 0,104 h-26.0 z"/><path class="gate" d="M430,268.0 h26.0 a52.0,52.0 0 0 1 0,104 h-26.0 z"/><path class="gate" d="M660,164.0 Q714.0,164.0 780,240 Q714.0,316.0 660,316.0 Q696.0,240 660,164.0 z"/><path class="wire" d="M508,160 H580 V202 H673.5"/><path class="wire" d="M508,320 H580 V278 H673.5"/><text class="mt" x="516" y="146" text-anchor="start">S</text><path d="M514.0,130.16 h14.799999999999999" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><text class="mt" x="530.8" y="146" text-anchor="start">· D0</text><text class="mt" x="516" y="350" text-anchor="start">S · D1</text><path class="wire" d="M780,240 H850"/><text class="sig" x="862" y="248" text-anchor="start">Y</text><text class="mt" x="800" y="206" text-anchor="start">S</text><path d="M798.0,190.16 h14.799999999999999" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><text class="mt" x="814.8" y="206" text-anchor="start">· D0 + S · D1</text><rect class="panel" x="596" y="404" width="344" height="236" rx="12"/><text class="small" x="616" y="438" text-anchor="start">Drawn as one symbol:</text><path class="gate" d="M706,466 L768,502 L768,566 L706,602 z"/><path class="wire" d="M640,500 H706"/><text class="sig" x="632" y="508" text-anchor="end">D0</text><text class="small" x="718" y="508" text-anchor="start">0</text><path class="wire" d="M640,568 H706"/><text class="sig" x="632" y="576" text-anchor="end">D1</text><text class="small" x="718" y="576" text-anchor="start">1</text><path class="wire" d="M737,616 V584"/><text class="sig" x="737" y="638" text-anchor="middle">S</text><path class="wire" d="M768,534 H834"/><text class="sig" x="844" y="542" text-anchor="start">Y</text></svg>
