<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 800" role="img" aria-label="A 2-bit wide 2-to-1 multiplexer drawn as two copies of the one-bit circuit. One inverter makes S-bar, and the two named select rails S and S-bar feed both copies. The upper copy routes bit 1, producing Y1 from D0 bit 1 and D1 bit 1; the lower copy routes bit 0, producing Y0 from D0 bit 0 and D1 bit 0.">
  <style>
    svg { background: #fff; }
    .title { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #24313f; }
    .label { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 23px; fill: #24313f; }
    .sig   { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #24313f; }
    .small { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 18px; fill: #64748b; }
    .mt    { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #2563eb; }
    .wire  { fill: none; stroke: #24313f; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .gate  { fill: #fff; stroke: #24313f; stroke-width: 3.5; stroke-linejoin: round; }
    .bub   { fill: #fff; stroke: #24313f; stroke-width: 3; }
    .node  { fill: #24313f; }
    .panel { fill: none; stroke: #f97316; stroke-width: 2; stroke-dasharray: 7 6; }
  </style>
<text class="title" x="40" y="44" text-anchor="start">Two bits wide: the same circuit, stamped once per bit</text><text class="small" x="40" y="74" text-anchor="start">One select line drives both copies, so the whole 2-bit word is routed at once.</text><rect class="panel" x="300" y="110" width="590" height="320" rx="12"/><text class="small" x="318" y="136" text-anchor="start">bit 1 — the MSB copy</text><text class="sig" x="356" y="178" text-anchor="end">D0<tspan font-size="0.68em" dy="0.22em">1</tspan></text><path class="wire" d="M364,170 H390"/><text class="sig" x="356" y="326" text-anchor="end">D1<tspan font-size="0.68em" dy="0.22em">1</tspan></text><path class="wire" d="M364,318 H390"/><path class="wire" d="M364,222 H390"/><text class="sig" x="356" y="229" text-anchor="end">S</text><path d="M341.4,210.52 h16.6" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><path class="wire" d="M364,370 H390"/><text class="sig" x="356" y="377" text-anchor="end">S</text><path class="gate" d="M390,144.0 h26.0 a52.0,52.0 0 0 1 0,104 h-26.0 z"/><path class="gate" d="M390,292.0 h26.0 a52.0,52.0 0 0 1 0,104 h-26.0 z"/><path class="gate" d="M620,194.0 Q674.0,194.0 740,270 Q674.0,346.0 620,346.0 Q656.0,270 620,194.0 z"/><path class="wire" d="M468,196 H540 V232 H633.5"/><path class="wire" d="M468,344 H540 V308 H633.5"/><path class="wire" d="M740,270 H810"/><text class="sig" x="822" y="278" text-anchor="start">Y<tspan font-size="0.68em" dy="0.22em">1</tspan></text><rect class="panel" x="300" y="450" width="590" height="320" rx="12"/><text class="small" x="318" y="476" text-anchor="start">bit 0 — the LSB copy</text><text class="sig" x="356" y="518" text-anchor="end">D0<tspan font-size="0.68em" dy="0.22em">0</tspan></text><path class="wire" d="M364,510 H390"/><text class="sig" x="356" y="666" text-anchor="end">D1<tspan font-size="0.68em" dy="0.22em">0</tspan></text><path class="wire" d="M364,658 H390"/><path class="wire" d="M364,562 H390"/><text class="sig" x="356" y="569" text-anchor="end">S</text><path d="M341.4,550.52 h16.6" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><path class="wire" d="M364,710 H390"/><text class="sig" x="356" y="717" text-anchor="end">S</text><path class="gate" d="M390,484.0 h26.0 a52.0,52.0 0 0 1 0,104 h-26.0 z"/><path class="gate" d="M390,632.0 h26.0 a52.0,52.0 0 0 1 0,104 h-26.0 z"/><path class="gate" d="M620,534.0 Q674.0,534.0 740,610 Q674.0,686.0 620,686.0 Q656.0,610 620,534.0 z"/><path class="wire" d="M468,536 H540 V572 H633.5"/><path class="wire" d="M468,684 H540 V648 H633.5"/><path class="wire" d="M740,610 H810"/><text class="sig" x="822" y="618" text-anchor="start">Y<tspan font-size="0.68em" dy="0.22em">0</tspan></text><text class="sig" x="42" y="408" text-anchor="end">S</text><path class="wire" d="M55,400 H170"/><circle class="node" cx="80" cy="400" r="5"/><path class="wire" d="M80,400 V464 H90"/><path class="gate" d="M90,444.0 L130,464 L90,484.0 z"/><circle class="bub" cx="138" cy="464" r="8"/><path class="wire" d="M146,464 H170"/><circle class="node" cx="170" cy="400" r="5"/><text class="sig" x="184" y="407" text-anchor="start">S</text><circle class="node" cx="170" cy="464" r="5"/><text class="sig" x="184" y="471" text-anchor="start">S</text><path d="M182.0,452.52 h16.6" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><rect class="panel" x="62" y="356" width="204" height="152" rx="12"/><text class="small" x="62" y="572" text-anchor="start">One inverter, two rails.</text><text class="small" x="62" y="598" text-anchor="start">Each select stub above</text><text class="small" x="62" y="624" text-anchor="start">names one of these two</text><text class="small" x="62" y="650" text-anchor="start">wires — same name,</text><text class="small" x="62" y="676" text-anchor="start">same wire.</text></svg>
