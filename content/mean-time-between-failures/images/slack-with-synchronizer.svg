<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2530 420" role="img" aria-label="A synchronizer over two clock periods: in period 1 the first flip-flop has t_r = 8 ns to settle between t_co and t_su; in period 2 the second flip-flop drives the 7 ns of logic">
  <style>
    text { font-family: Inter, Helvetica, Arial, sans-serif; }
    .label { font-size: 30px; font-weight: 700; fill: #24313f; }
    .small { font-size: 24px; fill: #64748b; }
    .blk   { font-size: 32px; font-weight: 700; fill: #24313f; }
    .ctl   { font-size: 28px; font-weight: 700; fill: #f97316; }
    .wire  { fill: none; stroke: #24313f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .cwire { fill: none; stroke: #f97316; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .gate  { fill: #fff; stroke: #24313f; stroke-width: 4; stroke-linejoin: round; }
    .box   { fill: #f3f6fb; stroke: #24313f; stroke-width: 4; stroke-linejoin: round; }
    .mbox  { fill: #fff4e8; stroke: #f97316; stroke-width: 4; stroke-linejoin: round; }
    .node  { fill: #24313f; }
    .head  { fill: #24313f; }
    .chead { fill: #f97316; }
    .pin   { font-size: 24px; font-weight: 700; fill: #64748b; }
    .cnode { fill: #f97316; }
    .wave  { fill: none; stroke: #24313f; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    .awave { fill: none; stroke: #12866f; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
    .guide { stroke: #c3ccd8; stroke-width: 2; stroke-dasharray: 6 8; }
    .lvl   { stroke: #c3ccd8; stroke-width: 2; stroke-dasharray: 2 10; }
    .bar   { stroke: #24313f; stroke-width: 3; stroke-linecap: round; }
  </style>
<style>.lab{font:700 34px Segoe UI,sans-serif;fill:#1c2433}.seg{font:700 32px Menlo,monospace;fill:#fff}.ax{font:600 28px Segoe UI,sans-serif;fill:#5a6676}.ed{font:600 28px Segoe UI,sans-serif;fill:#b8640a}</style><path d="M300,90 H330 V40 H870.0 V90 H1410 V40 H1950.0 V90 H2490 V40 H2510" fill="none" stroke="#b8640a" stroke-width="4"/><text class="lab" x="290" y="78" text-anchor="end">CLK</text><line x1="330" y1="40" x2="330" y2="370" stroke="#c9d3e0" stroke-width="2" stroke-dasharray="6 6"/><text class="ax" x="330" y="400" text-anchor="middle">0 ns</text><line x1="1410" y1="40" x2="1410" y2="370" stroke="#c9d3e0" stroke-width="2" stroke-dasharray="6 6"/><text class="ax" x="1410" y="400" text-anchor="middle">10 ns</text><line x1="2490" y1="40" x2="2490" y2="370" stroke="#c9d3e0" stroke-width="2" stroke-dasharray="6 6"/><text class="ax" x="2490" y="400" text-anchor="middle">20 ns</text><text class="ed" x="870.0" y="118" text-anchor="middle">period 1: T = 10 ns</text><text class="ed" x="1950.0" y="118" text-anchor="middle">period 2: T = 10 ns</text><text class="lab" x="290" y="186" text-anchor="end">FF1 &#8594; FF2</text><rect x="332" y="150" width="104" height="56" rx="8" fill="#b8640a"/><text class="seg" x="384.0" y="187" text-anchor="middle">t<tspan baseline-shift='sub' font-size='70%'>co</tspan></text><rect x="440" y="150" width="860" height="56" rx="8" fill="#2e7d4f"/><text class="seg" x="870.0" y="187" text-anchor="middle">t<tspan baseline-shift='sub' font-size='70%'>r</tspan> = 8 ns: settle</text><rect x="1304" y="150" width="104" height="56" rx="8" fill="#6b4fa8"/><text class="seg" x="1356.0" y="187" text-anchor="middle">t<tspan baseline-shift='sub' font-size='70%'>su</tspan></text><text class="lab" x="290" y="306" text-anchor="end">FF2 &#8594; logic &#8594; FF</text><rect x="1412" y="270" width="104" height="56" rx="8" fill="#b8640a"/><text class="seg" x="1464.0" y="307" text-anchor="middle">t<tspan baseline-shift='sub' font-size='70%'>co</tspan></text><rect x="1520" y="270" width="752" height="56" rx="8" fill="#4a6fa5"/><text class="seg" x="1896.0" y="307" text-anchor="middle">t<tspan baseline-shift='sub' font-size='70%'>pd</tspan> = 7 ns</text><rect x="2384" y="270" width="104" height="56" rx="8" fill="#6b4fa8"/><text class="seg" x="2436.0" y="307" text-anchor="middle">t<tspan baseline-shift='sub' font-size='70%'>su</tspan></text></svg>
