<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" role="img" aria-label="Gate-level 2-to-4 decoder with enable: two inverters produce the complement rails, and four AND gates each form one minterm, gated by the enable">
  <style>
    svg { background: #fff; }
    .title { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #24313f; }
    .label { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 23px; fill: #24313f; }
    .sig   { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #24313f; }
    .small { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 18px; fill: #64748b; }
    .mt    { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #2563eb; }
    .wire  { fill: none; stroke: #24313f; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .gate  { fill: #fff; stroke: #24313f; stroke-width: 3.5; stroke-linejoin: round; }
    .bub   { fill: #fff; stroke: #24313f; stroke-width: 3; }
    .node  { fill: #24313f; }
    .panel { fill: none; stroke: #f97316; stroke-width: 2; stroke-dasharray: 7 6; }
  </style>
<text class="title" x="40" y="44" text-anchor="start">A 2-to-4 decoder: one AND gate per minterm</text><text class="small" x="40" y="74" text-anchor="start">The enable reaches every gate, so EN = 0 forces all four outputs to 0.</text><text class="sig" x="52" y="158" text-anchor="end">A1</text><path class="wire" d="M62,150 H250"/><text class="sig" x="52" y="258" text-anchor="end">A0</text><path class="wire" d="M62,250 H250"/><text class="sig" x="52" y="358" text-anchor="end">EN</text><path class="wire" d="M62,350 H250"/><circle class="node" cx="130" cy="150" r="5"/><path class="wire" d="M130,150 V196 H150"/><path class="gate" d="M150,176.0 L190,196 L150,216.0 z"/><circle class="bub" cx="198" cy="196" r="8"/><path class="wire" d="M206,196 H250"/><circle class="node" cx="130" cy="250" r="5"/><path class="wire" d="M130,250 V296 H150"/><path class="gate" d="M150,276.0 L190,296 L150,316.0 z"/><circle class="bub" cx="198" cy="296" r="8"/><path class="wire" d="M206,296 H250"/><circle class="node" cx="250" cy="150" r="5"/><text class="sig" x="264" y="157" text-anchor="start">A1</text><circle class="node" cx="250" cy="196" r="5"/><text class="sig" x="264" y="203" text-anchor="start">A1</text><path d="M262.0,184.52 h29.2" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><circle class="node" cx="250" cy="250" r="5"/><text class="sig" x="264" y="257" text-anchor="start">A0</text><circle class="node" cx="250" cy="296" r="5"/><text class="sig" x="264" y="303" text-anchor="start">A0</text><path d="M262.0,284.52 h29.2" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><circle class="node" cx="250" cy="350" r="5"/><text class="sig" x="264" y="357" text-anchor="start">EN</text><rect class="panel" x="224" y="118" width="128" height="268" rx="12"/><text class="small" x="224" y="410" text-anchor="start">true and complement rails</text><text class="small" x="224" y="434" text-anchor="start">two inverters make all four</text><path class="gate" d="M620,74.0 h26.0 a52.0,52.0 0 0 1 0,104 h-26.0 z"/><path class="wire" d="M594,100.0 H620"/><text class="sig" x="586" y="106.0" text-anchor="end">A1</text><path d="M558.8,87.52 h29.2" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><path class="wire" d="M594,126.0 H620"/><text class="sig" x="586" y="132.0" text-anchor="end">A0</text><path d="M558.8,113.52 h29.2" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><path class="wire" d="M594,152.0 H620"/><text class="sig" x="586" y="158.0" text-anchor="end">EN</text><path class="wire" d="M698,126 H800"/><text class="sig" x="812" y="134" text-anchor="start">Y0</text><text class="mt" x="858" y="134" text-anchor="start">= m0</text><path class="gate" d="M620,196.0 h26.0 a52.0,52.0 0 0 1 0,104 h-26.0 z"/><path class="wire" d="M594,222.0 H620"/><text class="sig" x="586" y="228.0" text-anchor="end">A1</text><path d="M558.8,209.52 h29.2" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><path class="wire" d="M594,248.0 H620"/><text class="sig" x="586" y="254.0" text-anchor="end">A0</text><path class="wire" d="M594,274.0 H620"/><text class="sig" x="586" y="280.0" text-anchor="end">EN</text><path class="wire" d="M698,248 H800"/><text class="sig" x="812" y="256" text-anchor="start">Y1</text><text class="mt" x="858" y="256" text-anchor="start">= m1</text><path class="gate" d="M620,318.0 h26.0 a52.0,52.0 0 0 1 0,104 h-26.0 z"/><path class="wire" d="M594,344.0 H620"/><text class="sig" x="586" y="350.0" text-anchor="end">A1</text><path class="wire" d="M594,370.0 H620"/><text class="sig" x="586" y="376.0" text-anchor="end">A0</text><path d="M558.8,357.52 h29.2" stroke="#24313f" stroke-width="2.6" stroke-linecap="round" fill="none"/><path class="wire" d="M594,396.0 H620"/><text class="sig" x="586" y="402.0" text-anchor="end">EN</text><path class="wire" d="M698,370 H800"/><text class="sig" x="812" y="378" text-anchor="start">Y2</text><text class="mt" x="858" y="378" text-anchor="start">= m2</text><path class="gate" d="M620,440.0 h26.0 a52.0,52.0 0 0 1 0,104 h-26.0 z"/><path class="wire" d="M594,466.0 H620"/><text class="sig" x="586" y="472.0" text-anchor="end">A1</text><path class="wire" d="M594,492.0 H620"/><text class="sig" x="586" y="498.0" text-anchor="end">A0</text><path class="wire" d="M594,518.0 H620"/><text class="sig" x="586" y="524.0" text-anchor="end">EN</text><path class="wire" d="M698,492 H800"/><text class="sig" x="812" y="500" text-anchor="start">Y3</text><text class="mt" x="858" y="500" text-anchor="start">= m3</text><text class="small" x="586" y="566" text-anchor="end">Each gate names the two rails its minterm needs, plus the enable.</text></svg>
