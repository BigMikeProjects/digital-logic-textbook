<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="A three-variable Karnaugh map of the function that is 1 wherever Z is 1, with two groups of two circled: a cyan pair covering m1 and m3 in the X equals 0 row, and an amber pair covering m5 and m7 in the X equals 1 row. Beside each pair the algebra is worked out, factoring the shared literals and cancelling Y-bar plus Y to 1, leaving X-bar Z and X Z. Below, the identity Y-bar plus Y equals 1.">
