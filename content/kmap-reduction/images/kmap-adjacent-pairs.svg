<text class="note" x="250" y="502">A variable ORed with its complement is always 1, so the factored</text>
<text class="note" x="250" y="528">bracket collapses and the variable disappears from the term.</text>
<circle cx="44" cy="560" r="6" fill="#0aa5c4"/>
<text class="note" x="62" y="566">Pair 1 sits in the X = 0 row: both cells have X = 0 and Z = 1, and Y is the only thing that</text>
<text class="note" x="62" y="591">changes. Three literals become two.</text>
<circle cx="44" cy="614" r="6" fill="#e0890b"/>
<text class="note" x="62" y="620">Pair 2 is the same move one row down, where X = 1. Y changes again and drops out again.</text>
</svg>
