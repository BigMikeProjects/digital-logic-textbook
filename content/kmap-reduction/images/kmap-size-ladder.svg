<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 620" role="img" aria-label="Three four-variable Karnaugh maps side by side, each showing the same function whose 1s fill the cells where D equals 1. The first has a cyan group of two labelled three literals, the second an amber group of four labelled two literals, and the third a violet group of eight labelled one literal, the term D. Below, the rule that a group of 2-to-the-k cells yields a term of n minus k literals.">
