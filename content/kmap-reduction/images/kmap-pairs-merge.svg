<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" role="img" aria-label="Two three-variable Karnaugh maps side by side. On the left the same function carries a cyan pair and an amber pair, labelled X-bar Z plus X Z with three literals. An arrow leads right, annotated with the algebra X-bar Z plus X Z equals Z times X-bar plus X, which equals Z. On the right a single violet group of four covers all four 1s and is labelled Z with one literal. Below, F equals Z.">
