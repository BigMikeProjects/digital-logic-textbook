<text class="note" x="36" y="456">Now Z is the shared factor and X is the variable that varies, so X is the one that cancels. Each</text>
<text class="note" x="36" y="482">doubling of the group size is one more round of the same two steps.</text>
<rect x="36" y="508" width="928" height="64" rx="12" fill="#f6f8fb" stroke="#52677e" stroke-width="2.5"/>
<text x="58.0" y="550.0" text-anchor="start" font-size="28" font-weight="700" fill="#102a43">F</text><text x="77.0" y="550.0" text-anchor="start" font-size="28" font-weight="700" fill="#102a43"> </text><text x="84.9" y="550.0" text-anchor="start" font-size="28" font-weight="700" fill="#102a43">=</text><text x="102.2" y="550.0" text-anchor="start" font-size="28" font-weight="700" fill="#102a43"> </text><text x="110.1" y="550.0" text-anchor="start" font-size="28" font-weight="700" fill="#102a43">Z</text>
<text class="note" x="188" y="534">The four 1s are exactly the cells where Z = 1. The group of four is</text>
<text class="note" x="188" y="558">the Z region of the map, and reading it off gives the answer directly.</text>
</svg>
