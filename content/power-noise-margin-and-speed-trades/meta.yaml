title: "Power, Noise Margin and Speed Trades"
description: "One supply voltage, three consequences: for one fixed transistor, lowering V_DD cuts power as the square but shrinks the noise margin and slows every gate; why chips still got faster as the supply fell, and how products from hearing aids to servers pick their point on the trade."
chapter: foundations
section: circuits
