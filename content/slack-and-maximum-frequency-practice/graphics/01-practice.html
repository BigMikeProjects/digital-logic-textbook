<body>
<div class="viewport-container" id="viewportContainer">
<div class="design-surface" id="designSurface">

    <div class="topbar">
        <div class="anchor-sym">
            <svg viewBox="0 0 258 104" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="16" y="40" width="40" height="26" fill="#ffb74d"/>
                <rect x="56" y="40" width="96" height="26" fill="#4fc3f7"/>
                <rect x="152" y="40" width="44" height="26" fill="none" stroke="#66bb6a" stroke-width="2.5" stroke-dasharray="5 4"/>
                <rect x="196" y="40" width="30" height="26" fill="#ff8a3d"/>
                <line x1="16" y1="24" x2="16" y2="82" stroke="#ff8a3d" stroke-width="2.5"/>
                <line x1="226" y1="24" x2="226" y2="82" stroke="#ff8a3d" stroke-width="2.5"/>
                <text x="174" y="98" font-family="Menlo,monospace" font-size="13" fill="#66bb6a" text-anchor="middle">slack</text>
                <text x="121" y="20" font-family="Menlo,monospace" font-size="13" fill="#90a4ae" text-anchor="middle">T</text>
            </svg>
        </div>
        <div class="titles">
            <h1>Slack and Maximum Frequency <span class="sub">&mdash; practice set</span></h1>
            <div class="subtitle">Place every delay on one clock period by its start and duration, find the slack and the fastest clock the circuit can take</div>
        </div>
        <div class="page-count">Page <b id="pcNum">0</b> of 0&ndash;5</div>
    </div>

    <div class="tabstrip" id="tabstrip"></div>
    <div class="stage" id="stage"></div>

    <div class="footer">
        <div class="progress" id="progress"></div>
        <div class="controls">
            <span class="k">0</span>&ndash;<span class="k">5</span> page
            &middot; <span class="k">type</span> a start and a duration for each bar
            &middot; <span class="k green">C</span> check my work
            &middot; <span class="k amber">H</span> next hint
            &middot; <span class="k cy">F</span> final answer
            &middot; <span class="k">R</span> &#8634; clear
        </div>
    </div>

</div>
</div>

<script>
    // ============ RESPONSIVE SCALE ============
    const DESIGN_WIDTH = 1920, DESIGN_HEIGHT = 1080;
    function autoResize() {
        const c = document.getElementById('viewportContainer');
        const s = document.getElementById('designSurface');
        const vw = window.innerWidth, vh = window.innerHeight;
        let cw, ch;
        if (vw / vh > 16/9) { ch = vh; cw = ch*(16/9); } else { cw = vw; ch = cw*(9/16); }
        c.style.width = cw+'px'; c.style.height = ch+'px';
        s.style.transform = `scale(${cw/DESIGN_WIDTH})`;
    }
    autoResize();
    let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(autoResize,50); });
    window.addEventListener('orientationchange', () => setTimeout(autoResize,100));

    // ============ THE FIVE PROBLEMS (source of truth) ============
    // Times in ns. T is GIVEN (its frequency f = 1000 / T MHz is shown alongside). The logic is either `levels` identical
    // gate levels of `per` ns each, or a chain of `gates` whose delays add. For each of t_co, t_pd, t_su and slack the
    // student enters a START time and a DURATION; slack starts where t_pd ends and its duration is the slack itself
    // (negative when the logic is too slow). Every answer is exact (self-tested). Problems are unnamed.
    const PROBS = [
        { tco: 1, tsu: 1, levels: 2, per: 3, T: 10,
          note: 'The three delays use 8 ns of the 10 ns period; the 2 ns left over is the margin.' },
        { tco: 1.5, tsu: 0.5, levels: 3, per: 2, T: 8,
          note: 'Zero slack: t<sub>pd</sub> ends exactly where t<sub>su</sub> begins. It works, with nothing to spare.' },
        { tco: 0.5, tsu: 0.5, levels: 3, per: 1, T: 5,
          note: 'Everything is smaller at a fast clock, but the same sum decides it: 4 ns of delay in a 5 ns period.' },
        { tco: 1.5, tsu: 1, levels: 4, per: 2.5, T: 10,
          note: 'Negative slack: t<sub>pd</sub> runs 2.5 ns past the start of t<sub>su</sub>. The logic is too slow for this clock.' },
        { tco: 2, tsu: 1, gates: [['AND', 1.5], ['OR', 2], ['XOR', 3.5]], T: 12.5,
          note: 'Gates on one path add: 1.5 + 2 + 3.5 = 7 ns of logic, leaving 2.5 ns of the 12.5 ns period.' },
    ];
    const NPROB = PROBS.length;

    // ============ DERIVED ANSWERS (computed, never typed) ============
    const r3 = x => Math.round(x * 1000) / 1000;
    const fmt = x => String(r3(x));
    const fOf = P => r3(1000 / P.T);
    const tpdOf = P => r3(P.levels ? P.levels * P.per : P.gates.reduce((a, g) => a + g[1], 0));
    const needOf = P => r3(P.tco + tpdOf(P) + P.tsu);
    const slackOf = P => r3(P.T - needOf(P));
    const fmaxOf = P => r3(1000 / needOf(P));
    // the bars: [start, duration] for each parameter
    const BARS = ['co', 'pd', 'sl', 'su'];
    const BARNAME = { co: 't<sub>co</sub>', pd: 't<sub>pd</sub>', sl: 'slack', su: 't<sub>su</sub>' };
    const barAns = P => ({ co: [0, P.tco], pd: [P.tco, tpdOf(P)], sl: [r3(P.tco + tpdOf(P)), slackOf(P)], su: [r3(P.T - P.tsu), P.tsu] });
    const KEYS = ['co_s', 'co_d', 'pd_s', 'pd_d', 'su_s', 'su_d', 'sl_s', 'sl_d', 'fmax'];
    function answerOf(P, k) { if (k === 'fmax') return fmaxOf(P); const [b, j] = k.split('_'); return barAns(P)[b][j === 's' ? 0 : 1]; }
    const STEPKEYS = { 1: ['co_s', 'co_d', 'pd_s', 'pd_d'], 2: ['su_s', 'su_d'], 3: ['sl_s', 'sl_d'], 4: ['fmax'] };
    const span = P => Math.ceil(Math.max(P.T, needOf(P))) + 2;          // the grid runs from -1 to span ns
    const logicText = P => P.levels ? `${P.levels} levels of gates at ${fmt(P.per)} ns per level`
        : `a chain of gates: ${P.gates.map(g => `${g[0]} (${fmt(g[1])} ns)`).join(', ')}`;

    // ============ STEP CARDS ============
    const STEPS = [
        { n: 0, title: 'Understand the problem' },
        { n: 1, title: 't<sub>co</sub> and t<sub>pd</sub>' },
        { n: 2, title: 'Setup time t<sub>su</sub>' },
        { n: 3, title: 'Slack' },
        { n: 4, title: 'Maximum frequency' },
    ];
    function stepHint(P, n) {
        if (n === 0) return `The clock period is given: T = ${fmt(P.T)} ns, so the launch edge is at 0 and the capture edge at ${fmt(P.T)}. Note t<sub>co</sub>, t<sub>su</sub> and the logic.`;
        if (n === 1) return `t<sub>co</sub> starts at the launch edge, t = 0. t<sub>pd</sub> starts the moment t<sub>co</sub> ends; its duration is ${P.levels ? 'levels &times; delay per level' : 'the sum of the gate delays on the path'}.`;
        if (n === 2) return 't<sub>su</sub> has to end at the capture edge, t = T, so it starts t<sub>su</sub> before it: at T &minus; t<sub>su</sub>.';
        if (n === 3) return 'Slack fills the gap from the end of t<sub>pd</sub> to the start of t<sub>su</sub>. If t<sub>pd</sub> runs past the start of t<sub>su</sub>, the duration is negative.';
        return 'The fastest clock has zero slack: T<sub>min</sub> = t<sub>co</sub> + t<sub>pd</sub> + t<sub>su</sub>, and f<sub>max</sub> = 1000 / T<sub>min</sub> in MHz.';
    }
    const blankVal = () => Object.fromEntries(KEYS.map(k => [k, '']));
    const blankRev = () => Object.fromEntries(KEYS.map(k => [k, false]));
    const blankST = () => ({ hint: [false, false, false, false, false], shown: [false, false, false, false, false], lastHint: -1,
        val: blankVal(), rev: blankRev(), marks: null, solved: false });
    const ST = PROBS.map(blankST);
    let page = 0;
    function nextHelp(pi) {
        const s = ST[pi];
        for (let n = 0; n < 5; n++) { if (!s.hint[n] && !s.shown[n]) return { kind: 'hint', n }; if (!s.shown[n]) return { kind: 'show', n }; }
        return null;
    }
    const num = v => { const t = String(v).trim(); if (t === '' || t === '-' || t === '.') return NaN; const x = Number(t); return isFinite(x) ? x : NaN; };

    // ============ PAGE BUILD ============
    const stage = document.getElementById('stage');
    const tabstrip = document.getElementById('tabstrip'), progress = document.getElementById('progress');
    const TABS = [{ n: 0, label: 'How to Work', small: 'the steps + the buttons' }].concat(PROBS.map((P, i) => ({ n: i + 1, label: `Problem ${i + 1}`, small: `T = ${fmt(P.T)} ns` })));
    TABS.forEach(t => {
        const d = document.createElement('div'); d.className = 'tab'; d.dataset.page = t.n;
        d.innerHTML = `<div class="tnum">${t.n}</div><div class="tlabel">${t.label}<small>${t.small}</small></div><div class="tdone"></div>`;
        tabstrip.appendChild(d);
        const dot = document.createElement('div'); dot.className = 'dot'; dot.dataset.dot = t.n; progress.appendChild(dot);
    });
    const pages = [];
    function mkPage(id, inner) { const p = document.createElement('div'); p.className = 'page'; p.id = 'p' + id; p.innerHTML = inner; stage.appendChild(p); pages.push(p); return p; }

    mkPage(0, `
      <div class="leadwrap">
        <div class="steps">
          <div class="step"><div class="sn">0</div><div class="st">Understand the problem</div>
            <div class="sd">The clock period <b>T</b> is given. Data leaves one flip-flop t<sub>co</sub> after the launch edge, crosses the logic in t<sub>pd</sub>, and must arrive t<sub>su</sub> before the capture edge at <b>t = T</b>.</div></div>
          <div class="arrowcell">&rarr;</div>
          <div class="step"><div class="sn">1</div><div class="st">t<sub>co</sub> and t<sub>pd</sub></div>
            <div class="sd">t<sub>co</sub> <b>starts at 0</b>, the launch edge. t<sub>pd</sub> starts where t<sub>co</sub> ends; gates one after another <b>add</b>.</div></div>
          <div class="arrowcell">&rarr;</div>
          <div class="step"><div class="sn">2</div><div class="st">Setup time t<sub>su</sub></div>
            <div class="sd">t<sub>su</sub> <b>ends at the capture edge</b>, so it starts at <span class="mono">T &minus; t<sub>su</sub></span>.</div></div>
          <div class="arrowcell">&rarr;</div>
          <div class="step"><div class="sn">3</div><div class="st">Slack</div>
            <div class="sd">The gap from the end of t<sub>pd</sub> to the start of t<sub>su</sub>: <span class="mono">T &minus; (t<sub>co</sub> + t<sub>pd</sub> + t<sub>su</sub>)</span>. Zero only just works; <b>negative</b> means the logic is too slow.</div></div>
          <div class="arrowcell">&rarr;</div>
          <div class="step"><div class="sn">4</div><div class="st">Maximum frequency</div>
            <div class="sd">Set the slack to zero: <span class="mono">T<sub>min</sub> = t<sub>co</sub> + t<sub>pd</sub> + t<sub>su</sub></span>, and <span class="mono">f<sub>max</sub> = 1000 / T<sub>min</sub></span> in MHz.</div></div>
        </div>
        <div class="leadrow">
          <div class="panel conv"><div class="panel-head"><div class="ph">Conventions used in every problem</div></div>
            <div class="convbody">
              <ul>
                <li>Times are in <b>ns</b> and frequencies in <b>MHz</b>, so <b>f = 1000 / T</b>. Each problem gives T and shows its frequency.</li>
                <li>The launch edge is at <b>t = 0</b> and the capture edge at <b>t = T</b>; both are drawn for you.</li>
                <li><b>To place a bar:</b> type its <b>start</b> time and its <b>duration</b>. It draws on the budget as soon as both are in. Slack starts where t<sub>pd</sub> ends, and its duration may be <b>zero or negative</b>.</li>
                <li>Every answer is <b>exact</b>: whole numbers or one decimal place. f<sub>max</sub> also draws: a dashed line at 1 / f<sub>max</sub> with a ghost t<sub>su</sub> that should just meet the end of t<sub>pd</sub>.</li>
              </ul>
            </div>
          </div>
          <div class="panel helpkey"><div class="panel-head"><div class="ph">Getting help</div><div class="role">fill in every box first</div></div>
            <div class="helpbody">
              <div class="hrow"><span class="btn check">Check my work<span class="k">C</span></span><div>Marks every box: <b style="color:#66bb6a">green</b> right, <b style="color:#ef5350">red</b> wrong, <b style="color:#ffb74d">amber</b> empty. Nothing is revealed.</div></div>
              <div class="hrow"><span class="btn hint">Hint</span> <div>On each step card: a nudge for that step, in the bar at the bottom.</div></div>
              <div class="hrow"><span class="btn show">Show</span><div>On each step card: the worked step, filled into its boxes and drawn on the budget.</div></div>
              <div class="hrow"><span class="btn final">Final answer<span class="k">F</span></span><div>Shows every step at once. <span class="k">H</span> walks the hints and steps in order.</div></div>
            </div>
          </div>
        </div>
        <div class="cards">${PROBS.map((P, i) => `<div class="card" data-goto="${i + 1}"><div class="cn">PROBLEM ${i + 1}</div><div class="cf">t<sub>co</sub> = ${fmt(P.tco)} ns &middot; t<sub>su</sub> = ${fmt(P.tsu)} ns &middot; T = ${fmt(P.T)} ns</div></div>`).join('')}</div>
      </div>`);

    // ---- diagram geometry (SVG user units) ----
    const VW = 1780, X0 = 200, XR = 1750, ROWY = { clk: 92, co: 160, pd: 220, sl: 280, su: 340 }, BH = 36, VH = 400, T0 = -1;
    function diagramSVG(pi) {
        const P = PROBS[pi], s = ST[pi], S = span(P), UX = (XR - X0) / (S - T0), tx = t => X0 + (Math.max(T0, Math.min(S, t)) - T0) * UX;
        const v = k => num(s.val[k]);
        let o = `<svg viewBox="0 0 ${VW} ${VH}" class="td" id="td${pi + 1}">`;
        o += `<defs><pattern id="neg" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#3a1414"/><line x1="0" y1="0" x2="0" y2="12" stroke="#ef5350" stroke-width="4"/></pattern></defs>`;
        for (let t = T0; t <= S; t++) o += `<text class="tlab" x="${tx(t)}" y="26">${t}</text>`;
        o += `<text class="tlab tl" x="${X0 - 14}" y="26">t (ns)</text>`;
        for (let k = 0; k <= (S - T0) * 2; k++) { const t = T0 + k / 2; o += `<line class="gl${Number.isInteger(t) ? ' major' : ''}" x1="${tx(t)}" y1="40" x2="${tx(t)}" y2="${VH - 8}"/>`; }
        [['clk', 'CLK'], ['co', 't<tspan baseline-shift="sub" font-size="13">co</tspan>'], ['pd', 't<tspan baseline-shift="sub" font-size="13">pd</tspan>'],
         ['sl', 'slack'], ['su', 't<tspan baseline-shift="sub" font-size="13">su</tspan>']].forEach(([r, l]) => o += `<text class="rlab ${r === 'clk' ? '' : 'ans'}" x="14" y="${ROWY[r] + 7}">${l}</text>`);
        // clock: given period, edges at 0 and T
        const T = P.T, hi = ROWY.clk - 20, lo = ROWY.clk + 20;
        o += `<path class="tr given" d="M${tx(T0)},${lo}L${tx(0)},${lo}L${tx(0)},${hi}L${tx(T / 2)},${hi}L${tx(T / 2)},${lo}L${tx(T)},${lo}L${tx(T)},${hi}L${tx(S)},${hi}"/>`;
        o += `<line class="edgeline" x1="${tx(0)}" y1="46" x2="${tx(0)}" y2="${VH - 10}"/><text class="elab2" x="${tx(0) - 8}" y="${hi - 8}" style="text-anchor:end">launch edge</text>`;
        o += `<line class="edgeline" x1="${tx(T)}" y1="46" x2="${tx(T)}" y2="${VH - 10}"/><text class="elab2" x="${tx(T) + 8}" y="${hi - 8}" style="text-anchor:start">capture edge</text>`;
        // each bar from the student's start and duration, as soon as both are numbers
        BARS.forEach(b => {
            const st = v(b + '_s'), du = v(b + '_d');
            if (!isFinite(st) || !isFinite(du)) return;
            const rev = s.rev[b + '_s'] && s.rev[b + '_d'], c = du < 0 ? 'neg' : rev ? 'rev' : 'stu', lab = `${fmt(du)} ns`;
            if (du === 0) { o += `<line class="fline" style="stroke:#66bb6a;stroke-dasharray:none" x1="${tx(st)}" y1="${ROWY[b] - BH / 2}" x2="${tx(st)}" y2="${ROWY[b] + BH / 2}"/><text class="bv out" x="${tx(st) + 8}" y="${ROWY[b] + 6}">0 ns</text>`; return; }
            const x1 = tx(Math.min(st, st + du)), x2 = tx(Math.max(st, st + du)), w = x2 - x1; if (w <= 0) return;
            o += `<rect class="bar ${c}" x="${x1}" y="${ROWY[b] - BH / 2}" width="${w}" height="${BH}" rx="5"/>`;
            o += w > 64 ? `<text class="bv${c === 'neg' ? ' negl' : ''}" x="${(x1 + x2) / 2}" y="${ROWY[b] + 6}">${lab}</text>` : `<text class="bv out" x="${x2 + 8}" y="${ROWY[b] + 6}">${lab}</text>`;
        });
        // f_max: the earliest the capture edge could come, with a ghost t_su ending at it
        const fm = v('fmax');
        if (isFinite(fm) && fm > 0) { const tm = 1000 / fm;
            o += `<rect class="ghost" x="${tx(tm - P.tsu)}" y="${ROWY.su - BH / 2}" width="${tx(tm) - tx(tm - P.tsu)}" height="${BH}" rx="5"/>`;
            o += `<line class="fline" x1="${tx(tm)}" y1="${ROWY.co - 24}" x2="${tx(tm)}" y2="${ROWY.su + 24}"/><text class="flab" x="${tx(tm)}" y="${ROWY.su + 44}">1 / f<tspan baseline-shift="sub" font-size="11">max</tspan></text>`; }
        return o + `</svg>`;
    }

    const cardHTML = (id, n) => `
        <div class="panel scard" data-step="${n}">
          <div class="panel-head"><div class="ph"><span class="sn">Step ${n}</span></div></div>
          <div class="stitle">${STEPS[n].title}</div>
          <div class="sbody" id="s${id}-${n}"></div>
          <div class="sbtns"><span class="btn hint sm" data-act="hint" data-n="${n}">Hint</span><span class="btn show sm" data-act="show" data-n="${n}">Show</span></div>
        </div>`;
    const box = k => `<div class="ent" data-k="${k}"><input data-k="${k}" inputmode="decimal" autocomplete="off"></div>`;
    function probPage(pi) {
        const P = PROBS[pi], id = pi + 1;
        const p = mkPage(id, `
          <div class="toparea">
            <div class="panel probpanel">
              <div class="panel-head"><div class="ph">Problem ${id}</div></div>
              <div class="probbody">
                <div class="story">t<sub>co</sub> = <b>${fmt(P.tco)} ns</b>, t<sub>su</sub> = <b>${fmt(P.tsu)} ns</b>, clock period <b>T = ${fmt(P.T)} ns</b> (<b>f = ${fmt(fOf(P))} MHz</b>). The slowest logic path is ${logicText(P)}.</div>
                <div class="bargrid" id="ent${id}">
                  <span></span><span class="bh">start (ns)</span><span class="bh">duration (ns)</span>
                  ${['co', 'pd', 'su', 'sl'].map(b => `<label>${BARNAME[b]}</label>${box(b + '_s')}${box(b + '_d')}`).join('')}
                  <label>f<sub>max</sub></label>${box('fmax')}<span class="bu">MHz</span>
                </div>
              </div>
            </div>
            <div class="cardrow">${[0, 1, 2, 3, 4].map(n => cardHTML(id, n)).join('')}</div>
          </div>
          <div class="panel tdpanel">
            <div class="panel-head"><div class="ph">Timing budget</div><div class="role">one clock period, from the launch edge to the capture edge</div></div>
            <div class="tdbody" id="tdb${id}"></div>
          </div>
          <div class="helpbar">
            <span class="btn hint big" data-act="next">Next hint<span class="k">H</span></span>
            <div class="hintbox" id="hint${id}"></div>
            <div class="checkbox" id="chk${id}"></div>
            <span class="btn check big" data-act="check">Check my work<span class="k">C</span></span>
            <span class="btn final big" data-act="final">Final answer<span class="k">F</span></span>
            <span class="btn big" data-act="reset">&#8634; Clear<span class="k">R</span></span>
          </div>`);
        p.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(pi, b.dataset.act, b.dataset.n === undefined ? undefined : +b.dataset.n)));
        p.querySelector('#ent' + id).addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.k) typeVal(pi, t.dataset.k, t.value); });
    }
    PROBS.forEach((P, i) => probPage(i));

    // typing re-renders only the diagram (the inputs live outside it), so the caret never moves
    function typeVal(pi, k, v) {
        const s = ST[pi]; s.val[k] = v; s.rev[k] = false;
        if (s.marks) s.marks[k] = 'none';
        renderEntries(pi, false); renderDiagram(pi);
    }

    // ============ WORKED STEPS ============
    function stepCardHTML(P, n) {
        const A = barAns(P), pdExpr = P.levels ? `${P.levels} &times; ${fmt(P.per)}` : P.gates.map(g => fmt(g[1])).join(' + ');
        if (n === 0) return `<div class="ctext">Launch edge at 0, capture edge at T = <span class="mono">${fmt(P.T)} ns</span> (f = 1000 / ${fmt(P.T)} = ${fmt(fOf(P))} MHz).<br>t<sub>co</sub> = ${fmt(P.tco)} ns, t<sub>su</sub> = ${fmt(P.tsu)} ns.</div>`;
        if (n === 1) return `<div class="ctext">t<sub>co</sub>: start <span class="mono">0</span>, duration <span class="mono">${fmt(P.tco)}</span>.<br>t<sub>pd</sub> = ${pdExpr} = ${fmt(tpdOf(P))} ns: start <span class="mono">${fmt(A.pd[0])}</span>, duration <span class="mono">${fmt(A.pd[1])}</span>.</div>`;
        if (n === 2) return `<div class="ctext">Ends at T = ${fmt(P.T)}: start ${fmt(P.T)} &minus; ${fmt(P.tsu)} = <span class="mono">${fmt(A.su[0])}</span>, duration <span class="mono">${fmt(A.su[1])}</span>.</div>`;
        if (n === 3) { const sl = slackOf(P); return `<div class="ctext">Start <span class="mono">${fmt(A.sl[0])}</span> (end of t<sub>pd</sub>); duration ${fmt(A.su[0])} &minus; ${fmt(A.sl[0])} = <span class="${sl < 0 ? 'bad' : 'mono'}">${fmt(sl)}</span>.<br><span class="dimn">${P.note}</span></div>`; }
        return `<div class="ctext">T<sub>min</sub> = ${fmt(P.tco)} + ${fmt(tpdOf(P))} + ${fmt(P.tsu)} = ${fmt(needOf(P))} ns<br>f<sub>max</sub> = 1000 / ${fmt(needOf(P))} = <span class="mono">${fmt(fmaxOf(P))} MHz</span></div>`;
    }

    // ============ RENDER ============
    function renderDiagram(pi) { document.getElementById('tdb' + (pi + 1)).innerHTML = diagramSVG(pi); renderCheck(pi); }
    function renderEntries(pi, setValues = true) {
        const s = ST[pi], bx = document.getElementById('ent' + (pi + 1));
        KEYS.forEach(k => { const d = bx.querySelector(`.ent[data-k="${k}"]`), inp = d.querySelector('input');
            if (setValues) inp.value = s.val[k];
            d.className = `ent ${s.marks ? s.marks[k] : ''}${s.rev[k] ? ' rev' : ''}`; });
    }
    function renderCheck(pi) {
        const s = ST[pi], cb = document.getElementById('chk' + (pi + 1));
        if (!s.marks) { cb.innerHTML = ''; return; }
        const m = KEYS.map(k => s.marks[k]), c = x => m.filter(y => y === x).length;
        cb.innerHTML = `boxes <b>${c('ok')}</b>/${KEYS.length}` + (c('bad') ? ` <span class="bad">${c('bad')} wrong</span>` : '') + (c('miss') ? ` <span class="miss">${c('miss')} empty</span>` : '');
    }
    function renderProblem(pi) {
        const P = PROBS[pi], s = ST[pi], id = pi + 1, p = document.getElementById('p' + id);
        for (let n = 0; n < 5; n++) {
            const body = document.getElementById(`s${id}-${n}`), card = body.closest('.scard');
            card.classList.toggle('open', s.shown[n]);
            body.innerHTML = s.shown[n] ? stepCardHTML(P, n) : `<div class="blank">step ${n}</div>`;
            card.querySelector('[data-act="hint"]').classList.toggle('used', s.hint[n]);
            card.querySelector('[data-act="show"]').classList.toggle('used', s.shown[n]);
        }
        renderEntries(pi); renderDiagram(pi);
        const hb = document.getElementById('hint' + id), nx = nextHelp(pi);
        hb.innerHTML = s.lastHint >= 0 ? `<span class="hl">Step ${s.lastHint} hint</span>${stepHint(P, s.lastHint)}` :
            `<span class="dim">Give every bar its start and duration, then f<sub>max</sub>, and press <b style="color:#66bb6a">Check my work</b>. Stuck? Each step card has a <b style="color:#ffb74d">Hint</b> and a <b style="color:#90a4ae">Show</b>.</span>`;
        p.querySelector('[data-act="next"]').classList.toggle('used', !nx);
        p.querySelector('[data-act="final"]').classList.toggle('used', s.shown.every(Boolean));
        renderTabs();
    }
    function renderTabs() {
        document.querySelectorAll('.tab').forEach(t => {
            const n = +t.dataset.page; t.classList.toggle('on', n === page);
            if (n > 0) { const s = ST[n - 1], seen = s.shown.slice(1).some(Boolean); t.classList.toggle('done', s.solved); t.classList.toggle('seen', !s.solved && seen);
                t.querySelector('.tdone').textContent = s.solved ? '✓ solved' : seen ? 'answer shown' : ''; }
        });
    }

    // ============ ACTIONS ============
    function doShow(pi, n) { const s = ST[pi], P = PROBS[pi]; s.shown[n] = true;
        (STEPKEYS[n] || []).forEach(k => { if (num(s.val[k]) !== answerOf(P, k)) { s.val[k] = fmt(answerOf(P, k)); s.rev[k] = true; if (s.marks) s.marks[k] = 'none'; } }); }
    function act(pi, a, n) {
        const s = ST[pi], P = PROBS[pi];
        if (a === 'hint') { s.hint[n] = true; s.lastHint = n; }
        else if (a === 'show') doShow(pi, n);
        else if (a === 'next') { const nx = nextHelp(pi); if (nx) { if (nx.kind === 'hint') { s.hint[nx.n] = true; s.lastHint = nx.n; } else doShow(pi, nx.n); } }
        else if (a === 'final') { for (let k = 0; k < 5; k++) doShow(pi, k); }
        else if (a === 'check') {
            s.marks = {}; KEYS.forEach(k => { const x = num(s.val[k]);
                s.marks[k] = String(s.val[k]).trim() === '' ? 'miss' : Math.abs(x - answerOf(P, k)) < 1e-6 ? (s.rev[k] ? 'none' : 'ok') : 'bad'; });
            if (KEYS.every(k => s.marks[k] === 'ok')) s.solved = true;
        }
        else if (a === 'reset') { ST[pi] = blankST(); }
        renderProblem(pi);
    }

    // ============ NAVIGATION ============
    function render() {
        pages.forEach(p => p.classList.toggle('active', p.id === 'p' + page));
        document.querySelectorAll('.dot').forEach(d => d.classList.toggle('on', +d.dataset.dot === page));
        document.getElementById('pcNum').textContent = page;
        if (page > 0) renderProblem(page - 1); else renderTabs();
    }
    function setPage(n) { page = Math.max(0, Math.min(NPROB, n)); render(); }
    tabstrip.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setPage(+t.dataset.page)));
    document.querySelectorAll('[data-goto]').forEach(c => c.addEventListener('click', () => setPage(+c.dataset.goto)));
    document.addEventListener('keydown', (e) => {
        if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Enter') e.target.blur(); return; }
        const k = e.key;
        if (k >= '0' && k <= String(NPROB)) { setPage(+k); e.preventDefault(); return; }
        switch (k) {
            case 'ArrowRight': setPage(page + 1); e.preventDefault(); return;
            case 'ArrowLeft': setPage(page - 1); e.preventDefault(); return;
        }
        if (page === 0) return;
        const pi = page - 1;
        switch (k.toLowerCase()) {
            case 'h': act(pi, 'next'); break;
            case 'c': act(pi, 'check'); break;
            case 'f': act(pi, 'final'); break;
            case 'r': act(pi, 'reset'); break;
        }
    });

    // ============ SELF-TEST API ============
    window.__api = {
        setPage, act, typeVal, getState: () => ({ page, ST }), nextHelp, stepHint, stepCardHTML, STEPS, KEYS,
        PROBS, fOf, tpdOf, needOf, slackOf, fmaxOf, answerOf, barAns, span, BARS,
    };

    render();
</script>
</body>
</html>
