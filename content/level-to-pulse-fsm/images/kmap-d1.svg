<text x="638.0" y="308.0" font-size="28" font-weight="700" fill="#102a43">=</text><text x="663.8" y="308.0" font-size="28" font-weight="700" fill="#102a43">L</text><text x="684.2" y="308.0" font-size="28" font-weight="700" fill="#102a43">·</text><text x="694.0" y="308.0" font-size="28" font-weight="700" fill="#102a43">(Q1</text><text x="750.6" y="308.0" font-size="28" font-weight="700" fill="#102a43">+</text><text x="776.3" y="308.0" font-size="28" font-weight="700" fill="#102a43">Q0)</text>
<text class="note" x="612" y="364">Both pairs reach into the d at 111.</text>
