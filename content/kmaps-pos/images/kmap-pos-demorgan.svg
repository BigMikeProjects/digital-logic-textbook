<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-label="Four stacked rows showing the conversion. First, F-bar equals A-bar B-bar plus B-bar D-bar, read from the map. Second, F is the complement of that whole sum. Third, the bar over the sum breaks so the OR becomes an AND, giving the complement of A-bar B-bar times the complement of B-bar D-bar. Fourth, each remaining bar breaks so the ANDs become ORs and the double bars cancel, giving F equals A plus B, times B plus D.">
  <style>
    svg { background: #fff; }
    text { font-family: Inter, Helvetica, Arial, sans-serif; }
    .title  { font-size: 30px; font-weight: 700; fill: #102a43; }
    .sub    { font-size: 19px; fill: #8198af; }
    .hdr    { font-size: 22px; font-weight: 700; fill: #41556b; }
    .corner { font-size: 18px; font-weight: 700; fill: #8198af; }
    .val    { font-size: 34px; font-weight: 700; fill: #102a43; }
    .val0   { font-size: 34px; font-weight: 700; fill: #b9c6d4; }
    .valx   { font-size: 34px; font-weight: 700; fill: #7e93a8; }
    .idx    { font-size: 15px; fill: #a3b2c2; }
    .note   { font-size: 19px; fill: #41556b; }
    .grid   { fill: none; stroke: #aab9c9; stroke-width: 2; }
    .gridh  { fill: none; stroke: #52677e; stroke-width: 3; }
    .frame  { fill: none; stroke: #52677e; stroke-width: 3.5; }
    .cap    { font-size: 20px; font-weight: 700; fill: #41556b; }
    .capsub { font-size: 17px; fill: #8198af; }
    .step   { font-size: 17px; font-weight: 700; fill: #8198af; letter-spacing: 0.06em; }
  </style>
<text class="title" x="36" y="52">Break the line, change the sign</text>
<text class="sub" x="36" y="88">The map gave a sum of products for F&#772;. Two passes of De Morgan's theorem turn it into a product of sums for F.</text>
<rect x="36" y="130" width="928" height="76" rx="14" fill="#fff" stroke="#aab9c9" stroke-width="2"/>
<text class="step" x="58" y="158">FROM THE MAP</text>
<text x="58.0" y="192.0" text-anchor="start" font-size="26" font-weight="700" fill="#102a43">F</text><line x1="60.1" y1="171.2" x2="73.1" y2="171.2" stroke="#102a43" stroke-width="2.0" stroke-linecap="round"/><text x="77.8" y="192.0" text-anchor="start" font-size="26" font-weight="700" fill="#102a43"> </text><text x="85.0" y="192.0" text-anchor="start" font-size="26" font-weight="700" fill="#102a43">=</text><text x="101.2" y="192.0" text-anchor="start" font-size="26" font-weight="700" fill="#102a43"> </text><text x="108.4" y="192.0" text-anchor="start" font-size="26" font-weight="700" fill="#102a43">A</text><line x1="110.5" y1="171.2" x2="123.5" y2="171.2" stroke="#102a43" stroke-width="2.0" stroke-linecap="round"/><text x="128.2" y="192.0" text-anchor="start" font-size="26" font-weight="700" fill="#102a43">B</text><line x1="130.3" y1="171.2" x2="143.3" y2="171.2" stroke="#102a43" stroke-width="2.0" stroke-linecap="round"/><text x="148.0" y="192.0" text-anchor="start" font-size="26" font-weight="700" fill="#102a43"> </text><text x="155.2" y="192.0" text-anchor="start" font-size="26" font-weight="700" fill="#102a43">+</text><text x="171.4" y="192.0" text-anchor="start" font-size="26" font-weight="700" fill="#102a43"> </text><text x="178.6" y="192.0" text-anchor="start" font-size="26" font-weight="700" fill="#102a43">B</text><line x1="180.7" y1="171.2" x2="193.7" y2="171.2" stroke="#102a43" stroke-width="2.0" stroke-linecap="round"/><text x="198.4" y="192.0" text-anchor="start" font-size="26" font-weight="700" fill="#102a43">D</text><line x1="200.5" y1="171.2" x2="213.5" y2="171.2" stroke="#102a43" stroke-width="2.0" stroke-linecap="round"/>
<text class="capsub" x="942" y="170" text-anchor="end">the two zero groups, ORed</text>
<rect x="36" y="226" width="928" height="76" rx="14" fill="#fff" stroke="#aab9c9" stroke-width="2"/>
<text class="step" x="58" y="254">COMPLEMENT</text>
<text x="58.0" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">F</text><text x="75.7" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b"> </text><text x="83.0" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">=</text><text x="99.1" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b"> </text><text x="106.4" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">(</text><text x="115.7" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">A</text><line x1="117.8" y1="267.2" x2="130.8" y2="267.2" stroke="#41556b" stroke-width="2.0" stroke-linecap="round"/><text x="135.5" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">B</text><line x1="137.6" y1="267.2" x2="150.6" y2="267.2" stroke="#41556b" stroke-width="2.0" stroke-linecap="round"/><text x="155.2" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b"> </text><text x="162.5" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">+</text><text x="178.6" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b"> </text><text x="185.9" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">B</text><line x1="188.0" y1="267.2" x2="201.0" y2="267.2" stroke="#41556b" stroke-width="2.0" stroke-linecap="round"/><text x="205.7" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">D</text><line x1="207.8" y1="267.2" x2="220.8" y2="267.2" stroke="#41556b" stroke-width="2.0" stroke-linecap="round"/><text x="225.4" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">)</text><text x="234.8" y="288.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">′</text>
<text class="capsub" x="942" y="266" text-anchor="end">F is the complement of F-bar</text>
<rect x="36" y="322" width="928" height="76" rx="14" fill="#fff" stroke="#aab9c9" stroke-width="2"/>
<text class="step" x="58" y="350">BREAK 1</text>
<text x="58.0" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">F</text><text x="75.7" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b"> </text><text x="83.0" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">=</text><text x="99.1" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b"> </text><text x="106.4" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">(</text><text x="115.7" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">A</text><line x1="117.8" y1="363.2" x2="130.8" y2="363.2" stroke="#41556b" stroke-width="2.0" stroke-linecap="round"/><text x="135.5" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">B</text><line x1="137.6" y1="363.2" x2="150.6" y2="363.2" stroke="#41556b" stroke-width="2.0" stroke-linecap="round"/><text x="155.2" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">)</text><text x="164.6" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">′</text><text x="172.4" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b"> </text><text x="179.7" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">·</text><text x="187.5" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b"> </text><text x="194.8" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">(</text><text x="204.1" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">B</text><line x1="206.2" y1="363.2" x2="219.2" y2="363.2" stroke="#41556b" stroke-width="2.0" stroke-linecap="round"/><text x="223.9" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">D</text><line x1="226.0" y1="363.2" x2="239.0" y2="363.2" stroke="#41556b" stroke-width="2.0" stroke-linecap="round"/><text x="243.6" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">)</text><text x="253.0" y="384.0" text-anchor="start" font-size="26" font-weight="700" fill="#41556b">′</text>
<text class="capsub" x="942" y="362" text-anchor="end">the bar over a SUM breaks; + becomes ·</text>
<text x="942" y="386" text-anchor="end" font-size="18" font-weight="700" fill="#e0890b">+ → ·</text>
<rect x="36" y="418" width="928" height="76" rx="14" fill="#f6f8fb" stroke="#7c3aed" stroke-width="3"/>
<text class="step" x="58" y="446">BREAK 2</text>
<text x="58.0" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">F</text><text x="75.7" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed"> </text><text x="83.0" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">=</text><text x="99.1" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed"> </text><text x="106.4" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">(</text><text x="115.7" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">A</text><text x="133.4" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed"> </text><text x="140.7" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">+</text><text x="156.8" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed"> </text><text x="164.1" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">B</text><text x="181.8" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">)</text><text x="191.1" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">(</text><text x="200.5" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">B</text><text x="218.2" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed"> </text><text x="225.4" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">+</text><text x="241.6" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed"> </text><text x="248.8" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">D</text><text x="266.5" y="480.0" text-anchor="start" font-size="26" font-weight="700" fill="#7c3aed">)</text>
<text class="capsub" x="942" y="458" text-anchor="end">each bar over a PRODUCT breaks; · becomes +, and double bars cancel</text>
<text x="942" y="482" text-anchor="end" font-size="18" font-weight="700" fill="#e0890b">· → +</text>
<line x1="36" y1="528" x2="964" y2="528" stroke="#aab9c9" stroke-width="2"/>
<text class="note" x="36" y="568">Each product term of F&#772; became a sum term of F, every literal flipped, and the OR joining them</text>
<text class="note" x="36" y="594">became the AND that multiplies the sums &#8212; De Morgan's theorem applied to a whole expression at</text>
<text class="note" x="36" y="620">once. A prime marks the complement of the bracket it follows.</text>
</svg>
