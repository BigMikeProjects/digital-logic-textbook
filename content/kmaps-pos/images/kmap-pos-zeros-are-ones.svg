<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-label="Two four-variable Karnaugh maps side by side. The left map is F, with its zeros drawn dark at cells 0, 1, 2, 8 and 10 and don't-cares at 3 and 6. An arrow labelled complement leads to the right map, F-bar, where those same cells now hold 1s and the don't-cares are unchanged.">
  <style>
    svg { background: #fff; }
    text { font-family: Inter, Helvetica, Arial, sans-serif; }
    .title  { font-size: 30px; font-weight: 700; fill: #102a43; }
    .sub    { font-size: 19px; fill: #8198af; }
    .hdr    { font-size: 22px; font-weight: 700; fill: #41556b; }
    .corner { font-size: 18px; font-weight: 700; fill: #8198af; }
    .val    { font-size: 34px; font-weight: 700; fill: #102a43; }
    .val0   { font-size: 34px; font-weight: 700; fill: #b9c6d4; }
    .valx   { font-size: 34px; font-weight: 700; fill: #7e93a8; }
    .idx    { font-size: 15px; fill: #a3b2c2; }
    .note   { font-size: 19px; fill: #41556b; }
    .grid   { fill: none; stroke: #aab9c9; stroke-width: 2; }
    .gridh  { fill: none; stroke: #52677e; stroke-width: 3; }
    .frame  { fill: none; stroke: #52677e; stroke-width: 3.5; }
    .cap    { font-size: 20px; font-weight: 700; fill: #41556b; }
    .capsub { font-size: 17px; fill: #8198af; }
    .step   { font-size: 17px; font-weight: 700; fill: #8198af; letter-spacing: 0.06em; }
    .val    { fill: #b9c6d4; }
    .val0   { fill: #102a43; }
    .flip .val  { fill: #102a43; }
    .flip .val0 { fill: #b9c6d4; }
  </style>
<text class="title" x="36" y="52">The zeros of F are the ones of F&#772;</text>
<text class="sub" x="36" y="88">Circling the 0 cells of F is the same act as circling the 1 cells of its complement,</text>
<text class="sub" x="36" y="116">which is something a K-map reads out naturally.</text>
<rect x="220" y="176" width="62" height="62" fill="#eef3f8"/>
