<text class="val0" x="631" y="342" text-anchor="middle" font-size="30">0</text>
<text class="val0" x="693" y="342" text-anchor="middle" font-size="30">0</text>
<text class="val0" x="755" y="342" text-anchor="middle" font-size="30">0</text>
<text class="val0" x="817" y="342" text-anchor="middle" font-size="30">0</text>
<text class="val" x="631" y="404" text-anchor="middle" font-size="30">1</text>
<text class="val0" x="693" y="404" text-anchor="middle" font-size="30">0</text>
<text class="val0" x="755" y="404" text-anchor="middle" font-size="30">0</text>
<text class="val" x="817" y="404" text-anchor="middle" font-size="30">1</text></g>
<text class="cap" x="220" y="468" text-anchor="middle" font-size="26">F</text>
<text class="capsub" x="220" y="496" text-anchor="middle">group these 0s &#8230;</text>
<text class="cap" x="724" y="468" text-anchor="middle" font-size="26">F&#772;</text>
<text class="capsub" x="724" y="496" text-anchor="middle">&#8230; they are these 1s</text>
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L11,6 L0,11 z" fill="#8198af"/></marker></defs>
<path d="M386,300 H558" fill="none" stroke="#8198af" stroke-width="4" marker-end="url(#ah)"/>
<text class="capsub" x="472" y="280" text-anchor="middle">complement</text>
<line x1="36" y1="524" x2="964" y2="524" stroke="#aab9c9" stroke-width="2"/>
<circle cx="44" cy="556" r="6" fill="#102a43"/>
<text class="note" x="62" y="562">Every specified cell flips: a 0 in F is a 1 in F&#772;, and a 1 in F is a 0 in F&#772;.</text>
<circle cx="44" cy="585" r="6" fill="#6b7f95"/>
<text class="note" x="62" y="591">A don't-care stays a don't-care. It was never specified in F, so it is not specified in F&#772; either</text>
<text class="note" x="62" y="616">&#8212; you may still use it to enlarge a group.</text>
</svg>
