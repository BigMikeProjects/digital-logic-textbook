<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" role="img" aria-label="A four-variable Karnaugh map of F equal to Pi M of 0, 1, 2, 8 and 10 with don't-cares at 3 and 6. An amber group of four covers the whole top row, m0, m1, m3 and m2, and is labelled A-bar B-bar. A violet group covers the four corner cells m0, m2, m8 and m10, with dashed ties running outside the map across the left-right and top-bottom edges to show they are adjacent by wrap-around; it is labelled B-bar D-bar.">
  <style>
    svg { background: #fff; }
    text { font-family: Inter, Helvetica, Arial, sans-serif; }
    .title  { font-size: 30px; font-weight: 700; fill: #102a43; }
    .sub    { font-size: 19px; fill: #8198af; }
    .hdr    { font-size: 22px; font-weight: 700; fill: #41556b; }
    .corner { font-size: 18px; font-weight: 700; fill: #8198af; }
    .val    { font-size: 34px; font-weight: 700; fill: #102a43; }
    .val0   { font-size: 34px; font-weight: 700; fill: #b9c6d4; }
    .valx   { font-size: 34px; font-weight: 700; fill: #7e93a8; }
    .idx    { font-size: 15px; fill: #a3b2c2; }
    .note   { font-size: 19px; fill: #41556b; }
    .grid   { fill: none; stroke: #aab9c9; stroke-width: 2; }
    .gridh  { fill: none; stroke: #52677e; stroke-width: 3; }
    .frame  { fill: none; stroke: #52677e; stroke-width: 3.5; }
    .cap    { font-size: 20px; font-weight: 700; fill: #41556b; }
    .capsub { font-size: 17px; fill: #8198af; }
    .step   { font-size: 17px; font-weight: 700; fill: #8198af; letter-spacing: 0.06em; }
    .val    { fill: #b9c6d4; }
    .val0   { fill: #102a43; }
  </style>
<text class="title" x="36" y="52">Covering the zeros</text>
<text class="sub" x="36" y="88">Both groups follow the ordinary rules. The second one is only visible if you remember that the map wraps.</text>
