<circle cx="44" cy="636" r="6" fill="#e0890b"/>
<text class="note" x="62" y="642">Group 1 &#8212; the whole top row. Zeros at m0, m1, m2 plus the don't-care at m3 make a group of four.</text>
<text class="note" x="62" y="667">A = 0 and B = 0 hold; C and D vary. Term: A&#772;B&#772;.</text>
<circle cx="44" cy="690" r="6" fill="#7c3aed"/>
<text class="note" x="62" y="696">Group 2 &#8212; the four corners. The left and right columns are neighbours and so are the top and</text>
<text class="note" x="62" y="721">bottom rows, so these four cells are one group of four. B = 0 and D = 0 hold; A and C vary.</text>
<text class="note" x="62" y="746">Term: B&#772;D&#772;.</text>
<circle cx="44" cy="769" r="6" fill="#6b7f95"/>
<text class="note" x="62" y="775">The don't-care at m6 is left out: pairing it with m2 would not have enlarged either group, and a</text>
<text class="note" x="62" y="800">don't-care never has to be covered.</text>
</svg>
