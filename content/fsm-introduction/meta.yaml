title: "Finite State Machines (FSM) Introduction"
description: "Every synchronous finite state machine is three boxes: next-state logic, a state register of D flip-flops, and output logic. A 2-bit up/down counter with a MAX flag is read as a state diagram, a state table and a circuit."
chapter: sequential-logic
section: fsm
order: 40200

