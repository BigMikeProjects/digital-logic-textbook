title: "Verilog Signed and Unsigned Representations"
description: "A reg is unsigned unless declared signed; signedness changes how %d reads the bits, not the bits themselves — 8'hA5 is 165 unsigned and −91 signed. Includes the -8'd5 negative-literal subtlety."
chapter: verilog
section: verilog-basics
