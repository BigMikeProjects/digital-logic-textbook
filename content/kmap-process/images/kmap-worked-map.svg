<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" role="img" aria-label="Four-variable Karnaugh map of F with AB on the rows and CD on the columns in Gray-code order; ones at m1, m3, m5, m7, m9, m11, m13, m14 and m15, don't-cares at m4 and m6, zeros elsewhere">
  <style>
    svg { background: #fff; }
    text { font-family: Inter, Helvetica, Arial, sans-serif; }
    .title  { font-size: 30px; font-weight: 700; fill: #102a43; }
    .sub    { font-size: 19px; fill: #8198af; }
    .hdr    { font-size: 22px; font-weight: 700; fill: #41556b; }
    .corner { font-size: 18px; font-weight: 700; fill: #8198af; }
    .val    { font-size: 34px; font-weight: 700; fill: #102a43; }
    .val0   { font-size: 34px; font-weight: 700; fill: #b9c6d4; }
    .valx   { font-size: 34px; font-weight: 700; fill: #7e93a8; }
    .idx    { font-size: 15px; fill: #a3b2c2; }
    .note   { font-size: 19px; fill: #41556b; }
    .grid   { fill: none; stroke: #aab9c9; stroke-width: 2; }
    .gridh  { fill: none; stroke: #52677e; stroke-width: 3; }
    .frame  { fill: none; stroke: #52677e; stroke-width: 3.5; }
  </style>
<text class="title" x="36" y="52">F = &#931;m(1,3,5,7,9,11,13,14,15) + d(4,6)</text>
<text class="sub" x="36" y="86">AB down the rows, CD across the columns &#8212; both in Gray-code order</text>
