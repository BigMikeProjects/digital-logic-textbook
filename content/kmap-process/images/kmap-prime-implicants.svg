<circle cx="44" cy="652" r="6" fill="#0aa5c4"/>
<text class="note" x="62" y="658">D is the two middle columns, all eight cells where D = 1. Every other</text>
<text class="note" x="62" y="686">variable cancels.</text>
<circle cx="44" cy="714" r="6" fill="#e0890b"/>
<text class="note" x="62" y="720">BC closes up only because the don&#8217;t-care m6 is read as a 1. Without it</text>
<text class="note" x="62" y="748">the best available is the pair m14, m15.</text>
<circle cx="44" cy="776" r="6" fill="#7c3aed"/>
<text class="note" x="62" y="782">A&#772;B is legal too &#8212; a group may sit on X&#8217;s as well as 1s</text>
<text class="note" x="62" y="810">&#8212; and it cannot grow, so it is prime.</text>
</svg>
