<text class="title" x="40" y="52" text-anchor="start">Read the schematic literally: inverter, two ANDs, one OR</text><text class="small" x="40" y="84" text-anchor="start">F = A′B + CD  ·  each AND or OR is a NAND/NOR plus an inverter underneath</text><text class="label" x="60" y="159" text-anchor="end">A</text><text class="label" x="60" y="219" text-anchor="end">B</text><text class="label" x="60" y="309" text-anchor="end">C</text><text class="label" x="60" y="369" text-anchor="end">D</text><path class="wire" d="M75,150 H130"/><path class="gate" d="M130,128.0 L174,150 L130,172.0 z"/><circle class="bub" cx="183" cy="150" r="9"/><path class="wire" d="M192,150 H260"/><text class="small" x="214" y="132" text-anchor="middle">A</text><path d="M207.0,113 h14" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><path class="wire" d="M75,210 H260"/><path class="gate" d="M260,145.0 h55.0 a35.0,35.0 0 0 1 0,70 h-55.0 z"/><path class="wire" d="M350,180 H430 V225"/><path class="wire" d="M75,300 H260"/><path class="wire" d="M75,360 H260"/><path class="gate" d="M260,295.0 h55.0 a35.0,35.0 0 0 1 0,70 h-55.0 z"/><path class="wire" d="M350,330 H430 V285"/><path class="wire" d="M430,225 V240 H455"/><path class="wire" d="M430,285 V270 H455"/><path class="gate" d="M440,220.0 q45.0,0 100,35.0 q-55.00000000000001,35.0 -100,35.0 q22.0,-35.0 0,-70 z"/><path class="wire" d="M540,255 H620"/><text class="label" x="635" y="264" text-anchor="start">F</text><text class="cost" x="160" y="205" text-anchor="middle">2</text><text class="cost" x="305" y="250" text-anchor="middle">6</text><text class="cost" x="305" y="400" text-anchor="middle">6</text><text class="cost" x="492" y="320" text-anchor="middle">6</text><text class="small" x="760" y="170" text-anchor="start">Transistors</text><text class="label" x="760" y="205" text-anchor="start">inverter    2</text><text class="label" x="760" y="240" text-anchor="start">AND × 2   12</text><text class="label" x="760" y="275" text-anchor="start">OR           6</text><path class="wire" d="M760,290 H960" style="stroke-width:2"/><text class="total" x="760" y="325" text-anchor="start">total       20</text><text class="small" x="40" y="450" text-anchor="start">The 6-transistor AND and OR gates each hide a NAND/NOR (4) followed by an inverter (2).</text></svg>
