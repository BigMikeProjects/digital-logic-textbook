<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" role="img" aria-label="The laser range finder FSMD. IDLE clears C and waits while m is 0; m goes to COUNT. COUNT adds 1 to C and stays on r-bar and tc-bar; r and tc-bar go to LOAD; tc goes back to IDLE. LOAD loads Dist with C shifted right one place and clears C, then always goes to SHOW. SHOW clears C and asserts disp; it stays on m-bar and goes to COUNT on m">
  <style>
    text { font-family: Inter, Helvetica, Arial, sans-serif; }
    .label { font-size: 30px; font-weight: 700; fill: #24313f; }
    .small { font-size: 24px; fill: #64748b; }
    .blk   { font-size: 32px; font-weight: 700; fill: #24313f; }
    .ctl   { font-size: 28px; font-weight: 700; fill: #f97316; }
    .wire  { fill: none; stroke: #24313f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .cwire { fill: none; stroke: #f97316; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .gate  { fill: #fff; stroke: #24313f; stroke-width: 4; stroke-linejoin: round; }
    .box   { fill: #f3f6fb; stroke: #24313f; stroke-width: 4; stroke-linejoin: round; }
    .mbox  { fill: #fff4e8; stroke: #f97316; stroke-width: 4; stroke-linejoin: round; }
    .node  { fill: #24313f; }
    .head  { fill: #24313f; }
    .chead { fill: #f97316; }
    .pin   { font-size: 24px; font-weight: 700; fill: #64748b; }
    .cnode { fill: #f97316; }
    .wave  { fill: none; stroke: #24313f; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    .awave { fill: none; stroke: #12866f; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
    .guide { stroke: #c3ccd8; stroke-width: 2; stroke-dasharray: 6 8; }
    .lvl   { stroke: #c3ccd8; stroke-width: 2; stroke-dasharray: 2 10; }
    .bar   { stroke: #24313f; stroke-width: 3; stroke-linecap: round; }
  </style>
<style>.arc0 { fill: none; stroke: #24313f; stroke-width: 4; }.arc1 { fill: none; stroke: #4a6fa5; stroke-width: 5; }.h1 { fill: #4a6fa5; } .lab1 { font-size: 30px; font-weight: 700; fill: #4a6fa5; }.bub { fill: #fff; stroke: #24313f; stroke-width: 4; }.code { font-size: 40px; font-weight: 700; fill: #24313f; }.inbub { font-size: 28px; font-weight: 700; fill: #64748b; }.codeb { font-size: 30px; font-weight: 700; fill: #4a6fa5; }</style><style>.arcA { fill: none; stroke: #12866f; stroke-width: 5; stroke-dasharray: 14 9; } .hA { fill: #12866f; }.labA { font-size: 30px; font-weight: 700; fill: #12866f; }</style><path class="arc0" d="M390.6,254.0 Q560.0,224.0 705.8,249.8"/><polygon class="head" points="725.5,253.3 702.1,235.9 697.6,261.5"/><text x="549.4" y="222.8117808241271" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">m</text><path class="arc0" d="M729.4,286.0 Q560.0,316.0 414.2,290.2"/><polygon class="head" points="394.5,286.7 417.9,304.1 422.4,278.5"/><text x="541.7" y="343.18821917587286" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">tc</text><path class="arc0" d="M820.0,362.0 Q820.0,455.0 820.0,524.0"/><polygon class="head" points="820.0,544.0 833.0,518.0 807.0,518.0"/><text x="838.0" y="466.0" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">r·</text><text x="876.5" y="466.0" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">tc</text><line x1="878.5" y1="437.8" x2="913.1" y2="437.8" stroke="#4a6fa5" stroke-width="3" stroke-linecap="round"/><path class="arc0" d="M728.0,640.0 Q560.0,640.0 416.0,640.0"/><polygon class="head" points="396.0,640.0 422.0,653.0 422.0,627.0"/><text class="small" x="561.0" y="684.0" text-anchor="middle">always</text><path class="arc0" d="M375.0,586.7 Q560.0,455.0 725.5,337.3"/><polygon class="head" points="741.8,325.7 713.1,330.1 728.1,351.3"/><text x="581.2" y="485.5797550216229" font-s