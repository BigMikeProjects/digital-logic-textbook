<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 820" role="img" aria-label="The traffic-light controller as an FSM: NSG, NSY, EWG, EWY in a loop, each moving to the next on tc and staying on tc-bar; reset into NSG; Moore outputs NS_G EW_R green, NS_Y EW_R, NS_R EW_G green, NS_R EW_Y">
  <style>
    text { font-family: Inter, Helvetica, Arial, sans-serif; }
    .label { font-size: 30px; font-weight: 700; fill: #24313f; }
    .small { font-size: 24px; fill: #64748b; }
    .blk   { font-size: 32px; font-weight: 700; fill: #24313f; }
    .ctl   { font-size: 28px; font-weight: 700; fill: #f97316; }
    .wire  { fill: none; stroke: #24313f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .cwire { fill: none; stroke: #f97316; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .gate  { fill: #fff; stroke: #24313f; stroke-width: 4; stroke-linejoin: round; }
    .box   { fill: #f3f6fb; stroke: #24313f; stroke-width: 4; stroke-linejoin: round; }
    .mbox  { fill: #fff4e8; stroke: #f97316; stroke-width: 4; stroke-linejoin: round; }
    .node  { fill: #24313f; }
    .head  { fill: #24313f; }
    .chead { fill: #f97316; }
    .pin   { font-size: 24px; font-weight: 700; fill: #64748b; }
    .cnode { fill: #f97316; }
    .wave  { fill: none; stroke: #24313f; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    .awave { fill: none; stroke: #12866f; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
    .guide { stroke: #c3ccd8; stroke-width: 2; stroke-dasharray: 6 8; }
    .lvl   { stroke: #c3ccd8; stroke-width: 2; stroke-dasharray: 2 10; }
    .bar   { stroke: #24313f; stroke-width: 3; stroke-linecap: round; }
  </style>
<style>.arc0 { fill: none; stroke: #24313f; stroke-width: 4; }.arc1 { fill: none; stroke: #4a6fa5; stroke-width: 5; }.h1 { fill: #4a6fa5; } .lab1 { font-size: 30px; font-weight: 700; fill: #4a6fa5; }.bub { fill: #fff; stroke: #24313f; stroke-width: 4; }.code { font-size: 40px; font-weight: 700; fill: #24313f; }.inbub { font-size: 28px; font-weight: 700; fill: #64748b; }.codeb { font-size: 30px; font-weight: 700; fill: #4a6fa5; }</style><style>.arcA { fill: none; stroke: #12866f; stroke-width: 5; stroke-dasharray: 14 9; } .hA { fill: #12866f; }.labA { font-size: 30px; font-weight: 700; fill: #12866f; }</style><path class="arc0" d="M412.0,250.0 Q545.0,250.0 654.0,250.0"/><polygon class="head" points="674.0,250.0 648.0,237.0 648.0,263.0"/><text x="524.7" y="228.0" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">tc</text><path class="arc0" d="M760.0,332.0 Q760.0,425.0 760.0,494.0"/><polygon class="head" points="760.0,514.0 773.0,488.0 747.0,488.0"/><text x="790.0" y="434.0" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">tc</text><path class="arc0" d="M678.0,600.0 Q545.0,600.0 436.0,600.0"/><polygon class="head" points="416.0,600.0 442.0,613.0 442.0,587.0"/><text x="526.7" y="646.0" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">tc</text><path class="arc0" d="M330.0,518.0 Q330.0,425.0 330.0,356.0"/><polygon class="head" points="330.0,336.0 317.0,362.0 343.0,362.0"/><text x="261.5" y="436.0" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">tc</text><path class="arc0" d="M256.9,287.2 C174.1,383.1 174.1,116.9 240.5,195.7"/><polygon class="head" points="253.4,211.0 246.6,182.7 226.7,199.4"/><text x="125.8" y="259.7730047501302" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">tc</text><line x1="127.8" y1="231.6" x2="162.4" y2="231.6" stroke="#4a6fa5" stroke-width="3" stroke-linecap="round