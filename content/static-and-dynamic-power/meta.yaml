title: "Static and Dynamic Power"
description: "Where a CMOS chip's power goes: dynamic power, the average cost of charging load capacitance on every 0-to-1 change (alpha C V squared f), and static power, the leakage paid just to hold outputs (N I_leak V_DD), with the design levers for each."
