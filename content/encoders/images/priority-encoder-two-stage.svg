<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" role="img" aria-label="A priority encoder in two stages: a masking stage of AND gates kills every input below the highest asserted one, producing a one-hot bus, which an ordinary plain encoder of three OR gates then turns into a binary code">
  <style>
    svg { background: #fff; }
    .title  { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #24313f; }
    .banner { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #7c3aed; letter-spacing: 0.6px; }
    .label  { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 22px; fill: #24313f; }
    .sig    { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #24313f; }
    .small  { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 17px; fill: #64748b; }
    .eq     { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 20px; fill: #24313f; }
    .hot    { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #f97316; }
    .wire   { fill: none; stroke: #24313f; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .gate   { fill: #fff; stroke: #24313f; stroke-width: 3.5; stroke-linejoin: round; }
    .bub    { fill: #fff; stroke: #24313f; stroke-width: 3; }
    .node   { fill: #24313f; }
    .bus    { fill: none; stroke: #f97316; stroke-width: 2.2; stroke-dasharray: 7 6; }
    .blk    { fill: #f8fafc; stroke: #24313f; stroke-width: 3; }
  </style>
<text class="title" x="40" y="42" text-anchor="start">A priority encoder is a mask stage in front of a plain encoder</text><text class="small" x="40" y="70" text-anchor="start">Stage 1 guarantees a one-hot bus, which is the only input stage 2 handles correctly.</text><text class="banner" x="250" y="104" text-anchor="middle">STAGE 1 — MASK OFF THE LOWER INPUTS</text><text class="banner" x="760" y="104" text-anchor="middle">STAGE 2 — PLAIN ENCODER</text><text class="sig" x="290" y="157" text-anchor="end">I3</text><path class="wire" d="M298,150 H520"/><text class="small" x="306" y="176" text-anchor="start">never masked</text><path class="gate" d="M330,216.0 h40.0 a34.0,34.0 0 0 1 0,68 h-40.0 z"/><path class="wire" d="M298,238.66666666666666 H330"/><text class="sig" x="290" y="244.66666666666666" text-anchor="end">I2</text><circle class="bub" cx="322" cy="261.3333333333333" r="8"/><path class="wire" d="M298,261.3333333333333 H314"/><text class="sig" x="290" y="267.3333333333333" text-anchor="end">I3</text><path class="wire" d="M404,250 H520"/><path class="gate" d="M330,323.0 h29.0 a45.0,45.0 0 0 1 0,90 h-29.0 z"/><path class="wire" d="M298,345.5 H330"/><text class="sig" x="290" y="351.5" text-anchor="end">I1</text><circle class="bub" cx="322" cy="368.0" r="8"/><path class="wire" d="M298,368.0 H314"/><text class="sig" x="290" y="374.0" text-anchor="end">I3</text><circle class="bub" cx="322" cy="390.5" r="8"/><path class="wire" d="M298,390.5 H314"/><text class="sig" x="290" y="396.5" text-anchor="end">I2</text><path class="wire" d="M404,368 H520"/><path class="gate" d="M330,444.0 h18.0 a56.0,56.0 0 0 1 0,112 h-18.0 z"/><path class="wire" d="M298,466.4 H330"/><text class="sig" x="290" y="472.4" text-anchor="end">I0</text><circle class="bub" cx="322" cy="488.8" r="8"/><path class="wire" d="M298,488.8 H314"/><text class="sig" x="290" y="494.8" text-anchor="end">I3</text><circle class="bub" cx="322" cy="511.2" r="8"/><path class="wire" d="M298,511.2 H314"/><text class="sig" x="290" y="517.2" text-anchor="end">I2</text><circle class="bub" cx="322" cy="533.6" r="8"/><path class="wire" d="M298,533.6 H314"/><text class="sig" x="290" y="539.6" text-anchor="end">I1</text><path class="wire" d="M404,500 H520"/><rect class="bus" x="476" y="118" width="88" height="412" rx="14"/><circle class="node" cx="520" cy="150" r="6"/><text class="sig" x="520" y="134" text-anchor="middle">y3</text><circle class="node" cx="520" cy="250" r="6"/><text class="sig" x="520" y="234" text-anchor="middle">y2</text><circle class="node" cx="520" cy="368" r="6"/><text class="sig" x="520" y="352" text-anchor="middle">y1</text><circle class="node" cx="520" cy="500" r="6"/><text class="sig" x="520" y="484" text-anchor="middle">y0</text><text class="hot" x="520" y="556" text-anchor="middle">one-hot, guaranteed</text><rect class="blk" x="610" y="150" width="250" height="300" rx="14"/><text class="label" x="735" y="196" text-anchor="middle">plain encoder</text><text class="small" x="735" y="222" text-anchor="middle">three OR gates</text><text class="eq" x="634" y="280" text-anchor="start">A1 = y3 + y2</text><text class="eq" x="634" y="320" text-anchor="start">A0 = y3 + y1</text><text class="eq" x="634" y="360" text-anchor="start">V  = y3 + y2 + y1 + y0</text><path class="wire" d="M860,250 H910"/><text class="sig" x="920" y="257" text-anchor="start">A1</text><path class="wire" d="M860,300 H910"/><text class="sig" x="920" y="307" text-anchor="start">A0</text><path class="wire" d="M860,350 H910"/><text class="sig" x="920" y="357" text-anchor="start">V</text><text class="small" x="40" y="584" text-anchor="start">A bubble means “…and this higher input is NOT on”. Each gate names the signals it uses — same name, same wire.</text></svg>
