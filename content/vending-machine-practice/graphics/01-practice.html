    const Q = [{"label": "", "stem": "Why does this design keep the money in register A instead of using one state per amount (0¢, 5¢, 10¢, …)?", "choices": ["The comparator only works on registers", "A register is faster than a state flip-flop", "One state per amount would make V a Mealy output", "One state per amount needs a state for every coin combination and more for every price change. A register holds any amount in four states"], "ans": "d", "why": "Separate data from control: the amount lives in A, and the controller only ever sees <span class=\"mono\">paid</span>.", "hint": "Count the states one-per-amount would need to take 90&cent; in nickels, dimes and quarters. What happens when a price changes?", "fig": 0}, {"label": "", "stem": "In PAY, a dime arrives (D = 1). What does the coin path in Figure 2 put on the <span class=\"mono\">coin</span> line?", "choices": ["10, because the encoder makes s₁s₀ = 10 and the mux picks its 10 input", "5, because the encoder's s₀ = 1", "25, because D and Q share s₁", "0, because coin = N + D + Q is a 1-bit signal"], "ans": "a", "why": "The encoder gives s₁ = D + Q = 1 and s₀ = N + Q = 0, so the select is 10, which picks the mux's 10 input.", "hint": "The coin sensors are one-hot. In Figure 2, follow D through the encoder to the mux's select lines.", "fig": 1}, {"label": "", "stem": "What does the <span class=\"mono\">paid</span> signal tell the controller?", "choices": ["That a coin was inserted this clock", "That V has been asserted", "That C holds the change", "That the amount paid has reached the price: the comparator's A ≥ P"], "ans": "d", "why": "<span class=\"mono\">paid</span> is a status signal from the A ≥ P comparator. The controller never sees a money value.", "hint": "Find the comparator in Figure 2. Which two registers does it compare?", "fig": 1}, {"label": "", "stem": "A customer presses S2, then inserts Q, Q, Q, D, D. What is in C when the machine reaches VEND?", "choices": ["10¢", "5¢", "15¢", "0¢"], "ans": "b", "why": "A goes 25, 50, 75, 85, 95. 95 ≥ 90 is paid, so C ← 95 − 90 = 5.", "hint": "Add the coins in order: 25, 25, 25, 10, 10. Stop once A &ge; P, then C &larr; A &minus; P.", "fig": 0}, {"label": "", "stem": "Which registers need a load line (ldA, ldP, ldC)?", "choices": ["None, because the mux in front of each register decides what it holds", "Only A and C, because P is loaded from constants", "All three, because each is written only on some arcs and must hold its value the rest of the time", "Only P, because the price changes just once per purchase"], "ans": "c", "why": "A changes only on the WAIT → PAY arc, the coin loop and the return arc. P changes only leaving WAIT. C changes only leaving WAIT, on paid and on return.", "hint": "For each register, list the arcs that write it. Is any register written on every clock?", "fig": 1}, {"label": "", "stem": "In PAY with A = 35¢ for the 75¢ item, the customer presses RTN. What happens?", "choices": ["A ← 0 only. The money is kept and the machine returns to WAIT", "On that edge C ← 35 and A ← 0, and the machine goes to RET, where CR = 1 pays out the 35¢", "The machine goes to VEND with C = 35 and V = 1", "Nothing happens until A ≥ P"], "ans": "b", "why": "The arc A &lt; P, RTN does C ← A and A ← 0 on one edge. RET asserts CR, then the machine returns to WAIT. V stays 0.", "hint": "In Figure 1, find the arc out of PAY taken on RTN before the item is paid for, and read its transfers.", "fig": 0}, {"label": "", "stem": "Which equation is the controller's ldA?", "choices": ["ldA = Q<sub>WAIT</sub> · (S1 + S2) + Q<sub>PAY</sub> · (paid + RTN)", "ldA = Q<sub>PAY</sub> · coin", "ldA = Q<sub>WAIT</sub> · (S1 + S2) + Q<sub>PAY</sub> · ¬paid · (RTN + coin)", "ldA = Q<sub>WAIT</sub> · (S1 + S2) + Q<sub>PAY</sub> · coin"], "ans": "c", "why": "A loads leaving WAIT (cleared), on each coin before paid, and on a return (cleared). Q<sub>WAIT</sub> · (S1 + S2) + Q<sub>PAY</sub> · coin misses the return, and Q<sub>WAIT</sub> · (S1 + S2) + Q<sub>PAY</sub> · (paid + RTN) is ldC.", "hint": "A loads leaving WAIT, on each coin before the item is paid for, and when the customer gives up. Which choice covers all three?", "fig": 2}, {"label": "", "stem": "The machine is in PAY with A = 25¢ (not yet paid), and a dime arrives during clock cycle 3. When is ldA = 1, and when does A show 35?", "choices": ["ldA = 1 in cycle 3, and A = 35 in cycle 4", "ldA = 1 in cycle 3, and A = 35 in cycle 3", "ldA = 1 in cycle 4, and A = 35 in cycle 4", "ldA = 1 in cycle 4, and A = 35 in cycle 5"], "ans": "a", "why": "ldA is combinational in PAY's cycle with the coin (cycle 3). A takes A + coin at the next edge, so it shows 35 in cycle 4.", "hint": "ldA is combinational: it is 1 in the same cycle as the coin. A takes its new value at the next edge.", "fig": 2}];

                <div class="helpbody">
                    <div class="hrow"><span class="btn sm">Figure 1 2 3</span><span>switch the figure on the left of any question</span></div>
                    <div class="hrow"><span class="btn sm">click a choice</span><span>pick it; click again to unpick</span></div>
                    <div class="hrow"><span class="btn check sm">Check my work (C)</span><span>green right · red wrong (it never shows which one is right) · ✓ on the tab</span></div>
                    <div class="hrow"><span class="btn hint sm">Hint</span><span>a nudge, in the bar at the bottom</span></div>
                    <div class="hrow"><span class="btn sm">Show</span><span>the answer in blue and why it is right</span></div>
                    <div class="hrow"><span class="btn hint sm">Next hint (H)</span><span>the hint, then the answer</span></div>
                    <div class="hrow"><span class="btn final sm">Final answer (F)</span><span>every question's answer and why</span></div>
                </div></div></div>
            ${figPanel(0, 'figpanel0', 'The figures')}</div>`);

    Q.forEach((q, i) => mkPage(`<div class="row">${figPanel(i + 1, 'figpanel', 'Figure')}
            <div class="panel qpanel"><div class="panel-head"><span class="ph">Question ${i + 1}</span><span class="role">pick one, then Check my work</span></div>
                <div class="qbody" id="qbody${i}">${q.label ? `<div class="qlabel">${q.label}</div>` : ''}<div class="qstem">${q.stem}</div>
                    <div class="choices" id="choices${i}"></div><div id="why${i}"></div></div></div></div>
        <div class="helpbar"><div class="hintbox" id="hintbox${i}"><span class="dim">Pick a choice and press Check my work. Hint nudges; Show gives the answer and why.</span></div>
            <span class="btn hint" id="hintbtn${i}" onclick="act('hint')">Hint</span>
            <span class="btn" id="showbtn${i}" onclick="act('show')">Show</span>
            <span class="btn check" onclick="act('check')">Check my work<span class="k">C</span></span>
            <span class="btn hint" onclick="act('next')">Next hint<span class="k">H</span></span>
            <span class="btn final" onclick="act('final')">Final answer<span class="k">F</span></span>
            <span class="btn" onclick="act('clear')">&#8634; Clear<span class="k">R</span></span></div>`));

    // ----- render -----
    function renderFig(pg) {
        const k = FIGSEL[pg], img = document.getElementById('fig' + pg);
        if (img.dataset.k !== String(k)) { img.width = F[k].w; img.height = F[k].h; img.src = F[k].src; img.alt = F[k].alt; img.dataset.k = k; }
        document.getElementById('figcap' + pg).innerHTML = `<b>Figure ${k + 1}</b> — ${F[k].cap}${F[k].note ? ` <span style="color:#7b8796">(${F[k].note})</span>` : ''}`;
        F.forEach((f, i) => document.getElementById(`fs${pg}-${i}`).classList.toggle('on', i === k));
    }
    function renderQ(i) {
        const q = Q[i], s = ST[i];
        document.getElementById('choices' + i).innerHTML = q.choices.map((c, j) => {
            const L = LET[j]; let cls = '';
            if (s.shown && L === q.ans) cls = ' rev';
            else if (s.pick === L) cls = s.mark === 'ok' ? ' ok' : s.mark === 'bad' ? ' bad' : ' on';
            return `<div class="choice${cls}" data-l="${L}" onclick="pick('${L}')"><span class="lt">${L}</span><span>${c}</span></div>`; }).join('');
        document.getElementById('why' + i).innerHTML = s.shown || s.mark === 'ok'
            ? `<div class="why"><span class="wl">Answer (${q.ans}).</span>${q.why}</div>` : '';
        document.getElementById('hintbtn' + i).classList.toggle('used', s.hinted);
        document.getElementById('showbtn' + i).classList.toggle('used', s.shown);
    }
    function render() {
        pages.forEach((p, i) => p.classList.toggle('active', i === page));
        document.querySelectorAll('.tab').forEach(t => { const n = +t.dataset.page; t.classList.toggle('on', n === page);
            t.classList.toggle('done', n > 0 && ST[n - 1].right); });
        document.getElementById('pcNum').textContent = page;
        renderFig(page);
        if (page > 0) renderQ(page - 1);
    }
    const setHelp = (i, h) => { document.getElementById('hintbox' + i).innerHTML = h; };

    // ----- actions -----
    function pickFig(pg, k) { FIGSEL[pg] = k; renderFig(pg); }
    function pick(L) {
        if (page < 1) return; const s = ST[page - 1];
        if (s.shown) return;                                     // the answer is out; nothing left to pick
        s.pick = s.pick === L ? null : L; s.mark = null; render();
    }
    function doShow(i) { const s = ST[i]; s.shown = true; s.pick = Q[i].ans; s.mark = null;
        setHelp(i, `<span class="hl">Answer (${Q[i].ans})</span><span class="dim">The reason is under the choices.</span>`); }
    function act(a) {
        if (page < 1) { if (a === 'next' || a === 'final') setPage(1); else return; }
        const i = page - 1, s = ST[i], q = Q[i];
        if (a === 'hint') { s.hinted = true; setHelp(i, `<span class="hl">Hint</span>${q.hint}`); }
        else if (a === 'show') doShow(i);
        else if (a === 'next') { if (!s.hinted && !s.shown) act('hint'); else if (!s.shown) doShow(i);
            else setHelp(i, '<span class="dim">This question is done. Go on to the next one.</span>'); }
        else if (a === 'final') { Q.forEach((qq, k) => { ST[k].shown = true; ST[k].pick = qq.ans; ST[k].mark = null; });
            setHelp(i, '<span class="hl">Final answer</span>Every question now shows its answer and why. Click through the tabs.'); }
        else if (a === 'check') {
            if (s.shown) setHelp(i, '<span class="dim">The answer is already shown.</span>');
            else if (!s.pick) setHelp(i, '<span class="hl">Pick a choice first.</span>');
            else if (s.pick === q.ans) { s.mark = 'ok'; s.right = true; setHelp(i, '<span class="ok">Right.</span>The reason is under the choices.'); }
            else { s.mark = 'bad'; setHelp(i, `<span class="bad">Not (${s.pick}).</span>Try another choice, or press Hint.`); } }
        else if (a === 'clear') { ST[i] = blank(); setHelp(i, '<span class="dim">Cleared.</span>'); }
        render();
    }
    function setPage(n) { page = Math.max(0, Math.min(NQ, n)); render(); }
    document.addEventListener('keydown', e => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key.toLowerCase();
        if (/^[0-8]$/.test(k)) setPage(+k);
        else if (k === 'c') act('check'); else if (k === 'h') act('next'); else if (k === 'f') act('final'); else if (k === 'r') act('clear');
        else if (k === 'arrowright') setPage(page + 1); else if (k === 'arrowleft') setPage(page - 1);
    });
    window.__api = { setPage, act, pick, pickFig, Q, F, state: i => ST[i], get page() { return page; } };
    window.pick = pick; window.act = act; window.setPage = setPage; window.pickFig = pickFig;
    render();

</script>
</body>
</html>
