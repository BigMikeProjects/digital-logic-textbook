    const Q = [{"label": "", "stem": "Which register needs a load line, and why?", "choices": ["Neither, because the mux in front of each register decides what it holds", "Dist, because it is written only in LOAD and must hold its value in every other state", "C, because it must hold its count while the light is in flight", "Both, because every register in a datapath needs a load line"], "ans": "b", "why": "C is written in every state (cleared in IDLE, LOAD and SHOW; incremented in COUNT), so it needs no load line. Dist is written only in LOAD, so ldDist tells it when to load.", "hint": "In Figure 1, list the states that write each register. A register written in every state loads on every clock anyway.", "fig": 0}, {"label": "", "stem": "In COUNT, the comparator in Figure 2 makes tc = 1. What does that mean for the measurement?", "choices": ["C has overflowed into Dist, so the display shows a wrong distance", "The echo has arrived, so the count is ready to load into Dist", "Dist is full, so the display turns on", "C reached 1023 with no echo, so the shot missed and the machine returns to IDLE"], "ans": "d", "why": "tc = (C == 1023), all ones. No echo means the shot missed, and the tc arc returns to IDLE with nothing displayed. This is the built-in timeout: the longest distance shown is 1023 &gt;&gt; 1 = 511 m.", "hint": "Find what the comparator in Figure 2 tests. What does it mean if that count is reached before any echo comes back?", "fig": 1}, {"label": "", "stem": "The machine enters LOAD with C = 14. What distance appears on the display?", "choices": ["28 m", "15 m", "7 m", "14 m"], "ans": "c", "why": "Dist ← C &gt;&gt; 1 = 14 / 2 = 7 m. (The count is the round trip: 14 m of light.)", "hint": "The count covers the light's trip there and back. Dist takes C shifted right by one.", "fig": 0}, {"label": "", "stem": "Dist is a 9-bit register wired to C[9:1], so bit C₀ is never used. Why?", "choices": ["A 9-bit register is cheaper, and the lost bit is too small to matter", "Dropping C₀ shifts C right by one, dividing by 2 because the light goes there and back", "Dropping C₀ rounds the count up to the nearest even number", "C₀ is always 0 while the machine is in LOAD"], "ans": "b", "why": "Wiring C[9:1] into Dist is a shift right by one, which is ÷2, and the light travels twice the distance. An odd count rounds <i>down</i> (C = 13 gives 6 m), so dropping C₀ does not round up to an even number.", "hint": "Dropping the lowest bit of a binary number is a shift. What does a shift right by one do, and why would a distance need it?", "fig": 1}, {"label": "", "stem": "The COUNT self-loop is labeled <span class=\"ov\">r</span>·<span class=\"ov\">tc</span> rather than just <span class=\"ov\">r</span>. What goes wrong with <span class=\"ov\">r</span> alone?", "choices": ["When r = 0 and tc = 1, both the self-loop and the arc to IDLE would be true at once", "The counter would stop incrementing when tc = 1", "When r = 1 and tc = 0, the machine would stay in COUNT and miss the echo", "Nothing; <span class=\"ov\">r</span> alone is equivalent, because tc can never be 1 while r = 0"], "ans": "a", "why": "The arcs leaving a state must be mutually exclusive. With <span class=\"ov\">r</span> alone, r = 0 and tc = 1 would make two arcs true. It is not true that tc can never be 1 while r = 0: tc = 1 with no echo is exactly the timeout case.", "hint": "From COUNT, list the arcs and their labels. Try r = 0 with tc = 1: how many arcs are true?", "fig": 0}, {"label": "", "stem": "The controller is built one-hot, with one flip-flop per state. Which is the D input of the LOAD flip-flop, Q<sub>LOAD</sub>⁺?", "choices": ["Q<sub>COUNT</sub> · r", "Q<sub>COUNT</sub> · <span class=\"ov\">r</span> · <span class=\"ov\">tc</span>", "Q<sub>LOAD</sub> + Q<sub>COUNT</sub> · r · <span class=\"ov\">tc</span>", "Q<sub>COUNT</sub> · r · <span class=\"ov\">tc</span>"], "ans": "d", "why": "One term per arc into LOAD. The only arc in is from COUNT on r · <span class=\"ov\">tc</span>. LOAD has no self-loop, so the choice with a Q<sub>LOAD</sub> term is wrong.", "hint": "One-hot: OR one term per arc that arrives at LOAD. How many arcs arrive there, and on what condition?", "fig": 2}, {"label": "", "stem": "On a timing diagram, the machine is in LOAD during one clock cycle. During that same cycle, what are ldDist and Dist?", "choices": ["ldDist = 0 and Dist = the new distance; ldDist rises one cycle later in SHOW", "ldDist = 1 and Dist = C, before the shift takes effect", "ldDist = 1, while Dist still holds its old value; the new distance appears in the next cycle (SHOW)", "ldDist = 1 and Dist = the new distance, both in the same cycle"], "ans": "c", "why": "ldDist is a Moore output, so it is combinational and is 1 during LOAD itself. The transfer Dist ← C &gt;&gt; 1 happens at the edge leaving LOAD, so Dist changes one cycle later, when disp = 1 in SHOW.", "hint": "ldDist is a controller output, combinational in the current state. A register transfer takes effect at the edge that leaves the state.", "fig": 2}, {"label": "", "stem": "From the controller in Figure 3, which equation gives the control signal clr?", "choices": ["clr = Q<sub>IDLE</sub> + Q<sub>LOAD</sub> + Q<sub>SHOW</sub>", "clr = Q<sub>COUNT</sub>", "clr = Q<sub>IDLE</sub> + Q<sub>SHOW</sub>", "clr = Q<sub>LOAD</sub> + Q<sub>SHOW</sub>"], "ans": "a", "why": "clr appears in IDLE, LOAD and SHOW (the three states with C ← 0). Only COUNT does not clear.", "hint": "In Figure 3, find every state that lists clr.", "fig": 2}];

        const c = document.getElementById('viewportContainer'), s = document.getElementById('designSurface');
        const vw = window.innerWidth, vh = window.innerHeight; let cw, ch;
        if (vw / vh > 16 / 9) { ch = vh; cw = ch * (16 / 9); } else { cw = vw; ch = cw * (9 / 16); }
        c.style.width = cw + 'px'; c.style.height = ch + 'px'; s.style.transform = `scale(${cw / DESIGN_WIDTH})`;
    }
    autoResize(); window.addEventListener('resize', autoResize);

    const NQ = Q.length, LET = ['a', 'b', 'c', 'd'];
    let page = 0;
    const blank = () => ({ pick: null, mark: null, shown: false, hinted: false, right: false });
    const ST = Q.map(blank);
    const FIGSEL = [0].concat(Q.map(q => q.fig));               // which figure each page's viewer shows

    // ----- tabs and pages -----
    const stage = document.getElementById('stage'), tabstrip = document.getElementById('tabstrip');
    [{ n: 0, label: 'How to Work', small: 'the system + the buttons' }].concat(Q.map((q, i) => ({ n: i + 1, label: `Question ${i + 1}`, small: 'pick one' })))
        .forEach(t => { const d = document.createElement('div'); d.className = 'tab' + (t.n ? '' : ' wide'); d.dataset.page = t.n;
            d.innerHTML = `<div class="tnum">${t.n}</div><div class="tlabel">${t.label}<small>${t.small}</small></div><div class="tdone">✓</div>`;
            d.onclick = () => setPage(t.n); tabstrip.appendChild(d); });
    const pages = [];
    function mkPage(inner) { const p = document.createElement('div'); p.className = 'page'; p.innerHTML = inner; stage.appendChild(p); pages.push(p); return p; }
    const figPanel = (pg, cls, head) => `<div class="panel ${cls}"><div class="panel-head"><span class="ph">${head}</span>
        <span class="figswitch">${F.map((f, i) => `<span class="btn sm" id="fs${pg}-${i}" onclick="pickFig(${pg},${i})">Figure ${i + 1}</span>`).join('')}</span></div>
        <div class="figbox"><img id="fig${pg}" alt=""></div><div class="figcap" id="figcap${pg}"></div></div>`;

    mkPage(`<div class="row0"><div class="col0">
            <div class="panel" style="flex:1"><div class="panel-head"><span class="ph">The system</span><span class="role">every question is about it</span></div>
                <div class="sysbody">${SYS}</div></div>
            <div class="panel"><div class="panel-head"><span class="ph">How to work</span><span class="role">and the buttons</span></div>
                <div class="helpbody">
                    <div class="hrow"><span class="btn sm">Figure 1 2 3</span><span>switch the figure on the left of any question</span></div>
                    <div class="hrow"><span class="btn sm">click a choice</span><span>pick it; click again to unpick</span></div>
                    <div class="hrow"><span class="btn check sm">Check my work (C)</span><span>green right · red wrong (it never shows which one is right) · ✓ on the tab</span></div>
                    <div class="hrow"><span class="btn hint sm">Hint</span><span>a nudge, in the bar at the bottom</span></div>
                    <div class="hrow"><span class="btn sm">Show</span><span>the answer in blue and why it is right</span></div>
                    <div class="hrow"><span class="btn hint sm">Next hint (H)</span><span>the hint, then the answer</span></div>
                    <div class="hrow"><span class="btn final sm">Final answer (F)</span><span>every question's answer and why</span></div>
                </div></div></div>
            ${figPanel(0, 'figpanel0', 'The figures')}</div>`);

    Q.forEach((q, i) => mkPage(`<div class="row">${figPanel(i + 1, 'figpanel', 'Figure')}
            <div class="panel qpanel"><div class="panel-head"><span class="ph">Question ${i + 1}</span><span class="role">pick one, then Check my work</span></div>
                <div class="qbody" id="qbody${i}">${q.label ? `<div class="qlabel">${q.label}</div>` : ''}<div class="qstem">${q.stem}</div>
                    <div class="choices" id="choices${i}"></div><div id="why${i}"></div></div></div></div>
        <div class="helpbar"><div class="hintbox" id="hintbox${i}"><span class="dim">Pick a choice and press Check my work. Hint nudges; Show gives the answer and why.</span></div>
            <span class="btn hint" id="hintbtn${i}" onclick="act('hint')">Hint</span>
            <span class="btn" id="showbtn${i}" onclick="act('show')">Show</span>
            <span class="btn check" onclick="act('check')">Check my work<span class="k">C</span></span>
            <span class="btn hint" onclick="act('next')">Next hint<span class="k">H</span></span>
            <span class="btn final" onclick="act('final')">Final answer<span class="k">F</span></span>
            <span class="btn" onclick="act('clear')">&#8634; Clear<span class="k">R</span></span></div>`));

    // ----- render -----
    function renderFig(pg) {
        const k = FIGSEL[pg], img = document.getElementById('fig' + pg);
        if (img.dataset.k !== String(k)) { img.width = F[k].w; img.height = F[k].h; img.src = F[k].src; img.alt = F[k].alt; img.dataset.k = k; }
        document.getElementById('figcap' + pg).innerHTML = `<b>Figure ${k + 1}</b> — ${F[k].cap}${F[k].note ? ` <span style="color:#7b8796">(${F[k].note})</span>` : ''}`;
        F.forEach((f, i) => document.getElementById(`fs${pg}-${i}`).classList.toggle('on', i === k));
    }
    function renderQ(i) {
        const q = Q[i], s = ST[i];
        document.getElementById('choices' + i).innerHTML = q.choices.map((c, j) => {
            const L = LET[j]; let cls = '';
            if (s.shown && L === q.ans) cls = ' rev';
            else if (s.pick === L) cls = s.mark === 'ok' ? ' ok' : s.mark === 'bad' ? ' bad' : ' on';
            return `<div class="choice${cls}" data-l="${L}" onclick="pick('${L}')"><span class="lt">${L}</span><span>${c}</span></div>`; }).join('');
        document.getElementById('why' + i).innerHTML = s.shown || s.mark === 'ok'
            ? `<div class="why"><span class="wl">Answer (${q.ans}).</span>${q.why}</div>` : '';
        document.getElementById('hintbtn' + i).classList.toggle('used', s.hinted);
        document.getElementById('showbtn' + i).classList.toggle('used', s.shown);
    }
    function render() {
        pages.forEach((p, i) => p.classList.toggle('active', i === page));
        document.querySelectorAll('.tab').forEach(t => { const n = +t.dataset.page; t.classList.toggle('on', n === page);
            t.classList.toggle('done', n > 0 && ST[n - 1].right); });
        document.getElementById('pcNum').textContent = page;
        renderFig(page);
        if (page > 0) renderQ(page - 1);
    }
    const setHelp = (i, h) => { document.getElementById('hintbox' + i).innerHTML = h; };

    // ----- actions -----
    function pickFig(pg, k) { FIGSEL[pg] = k; renderFig(pg); }
    function pick(L) {
        if (page < 1) return; const s = ST[page - 1];
        if (s.shown) return;                                     // the answer is out; nothing left to pick
        s.pick = s.pick === L ? null : L; s.mark = null; render();
    }
    function doShow(i) { const s = ST[i]; s.shown = true; s.pick = Q[i].ans; s.mark = null;
        setHelp(i, `<span class="hl">Answer (${Q[i].ans})</span><span class="dim">The reason is under the choices.</span>`); }
    function act(a) {
        if (page < 1) { if (a === 'next' || a === 'final') setPage(1); else return; }
        const i = page - 1, s = ST[i], q = Q[i];
        if (a === 'hint') { s.hinted = true; setHelp(i, `<span class="hl">Hint</span>${q.hint}`); }
        else if (a === 'show') doShow(i);
        else if (a === 'next') { if (!s.hinted && !s.shown) act('hint'); else if (!s.shown) doShow(i);
            else setHelp(i, '<span class="dim">This question is done. Go on to the next one.</span>'); }
        else if (a === 'final') { Q.forEach((qq, k) => { ST[k].shown = true; ST[k].pick = qq.ans; ST[k].mark = null; });
            setHelp(i, '<span class="hl">Final answer</span>Every question now shows its answer and why. Click through the tabs.'); }
        else if (a === 'check') {
            if (s.shown) setHelp(i, '<span class="dim">The answer is already shown.</span>');
            else if (!s.pick) setHelp(i, '<span class="hl">Pick a choice first.</span>');
            else if (s.pick === q.ans) { s.mark = 'ok'; s.right = true; setHelp(i, '<span class="ok">Right.</span>The reason is under the choices.'); }
            else { s.mark = 'bad'; setHelp(i, `<span class="bad">Not (${s.pick}).</span>Try another choice, or press Hint.`); } }
        else if (a === 'clear') { ST[i] = blank(); setHelp(i, '<span class="dim">Cleared.</span>'); }
        render();
    }
    function setPage(n) { page = Math.max(0, Math.min(NQ, n)); render(); }
    document.addEventListener('keydown', e => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key.toLowerCase();
        if (/^[0-8]$/.test(k)) setPage(+k);
        else if (k === 'c') act('check'); else if (k === 'h') act('next'); else if (k === 'f') act('final'); else if (k === 'r') act('clear');
        else if (k === 'arrowright') setPage(page + 1); else if (k === 'arrowleft') setPage(page - 1);
    });
    window.__api = { setPage, act, pick, pickFig, Q, F, state: i => ST[i], get page() { return page; } };
    window.pick = pick; window.act = act; window.setPage = setPage; window.pickFig = pickFig;
    render();

</script>
</body>
</html>
