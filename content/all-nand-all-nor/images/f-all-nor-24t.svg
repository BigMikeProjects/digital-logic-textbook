<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="F as all-NOR: the two product NORs and the final NOR carry input bubbles, the OR-shape NOR carries an output bubble; inverters on b, y, c, and the a-bar-b wire; 24 transistors">
