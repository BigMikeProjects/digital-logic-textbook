<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="G as all-NOR: the product NOR and final NOR carry input bubbles, the two OR-shape NORs carry output bubbles that cancel them; inverters only on c and d; 20 transistors">
  <style>
    svg { background: #fff; }
    .title { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #24313f; }
    .label { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 24px; fill: #24313f; }
    .small { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 18px; fill: #64748b; }
    .note { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 17px; fill: #f97316; font-weight: 700; }
    .total { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #24313f; }
    .cost { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #2563eb; }
    .wire { fill: none; stroke: #24313f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .gate { fill: #fff; stroke: #24313f; stroke-width: 4; stroke-linejoin: round; }
    .bub { fill: #fff; stroke: #24313f; stroke-width: 3.5; }
    .hl { fill: none; stroke: #f97316; stroke-width: 3; stroke-dasharray: 7 7; }
    .node { fill: #24313f; }
  </style>
<text class="title" x="36" y="48" text-anchor="start">G all-NOR: ANDs get input bubbles, ORs get output bubbles</text><text class="small" x="36" y="80" text-anchor="start">4 NOR + only 2 inverters (c, d) = 20 transistors — a product of sums fits NOR</text><text class="label" x="50" y="108" text-anchor="end">a</text><text class="label" x="50" y="158" text-anchor="end">b</text><text class="label" x="50" y="208" text-anchor="end">c</text><text class="label" x="50" y="338" text-anchor="end">d</text><text class="label" x="50" y="388" text-anchor="end">e</text><path class="wire" d="M60,150 H241"/><circle class="bub" cx="241" cy="150" r="9"/><path class="wire" d="M60,200 H120"/><path class="gate" d="M120,180.0 L160,200 L120,220.0 z"/><circle class="bub" cx="169" cy="200" r="9"/><path class="wire" d="M180,200 H241"/><circle class="bub" cx="241" cy="200" r="9"/><path class="gate" d="M250,140.0 h55.0 a35.0,35.0 0 0 1 0,70 h-55.0 z"/><path class="wire" d="M340,175 H400 V165 H460"/><path class="wire" d="M60,100 H400 V115 H460"/><path class="gate" d="M460,105.0 q45.0,0 100,35.0 q-55.00000000000001,35.0 -100,35.0 q22.0,-35.0 0,-70 z"/><circle class="bub" cx="569" cy="140" r="9"/><path class="wire" d="M578,140 H600 V228 H681"/><path class="wire" d="M60,330 H120"/><path class="gate" d="M120,310.0 L160,330 L120,350.0 z"/><circle class="bub" cx="169" cy="330" r="9"/><path class="wire" d="M180,330 H460"/><path class="wire" d="M60,380 H400 V380 H460"/><path class="gate" d="M460,320.0 q45.0,0 100,35.0 q-55.00000000000001,35.0 -100,35.0 q22.0,-35.0 0,-70 z"/><circle class="bub" cx="569" cy="355" r="9"/><path class="wire" d="M578,355 H600 V268 H681"/><circle class="bub" cx="681" cy="228" r="9"/><circle class="bub" cx="681" cy="268" r="9"/><path class="gate" d="M690,213.0 h55.0 a35.0,35.0 0 0 1 0,70 h-55.0 z"/><path class="wire" d="M780,248 H840"/><text class="label" x="852" y="256" text-anchor="start">G</text><ellipse class="hl" cx="625" cy="248" rx="72" ry="60"/><text class="note" x="625" y="335" text-anchor="middle">both pairs cancel</text><text class="note" x="210" y="122" text-anchor="middle">b → b′ free</text><text class="note" x="150" y="172" text-anchor="middle">c must arrive clean</text><text class="note" x="150" y="302" text-anchor="middle">d keeps its inverter</text><text class="note" x="852" y="293" text-anchor="middle">no leftover</text><text class="small" x="760" y="430" text-anchor="start">Transistors</text><text class="label" x="760" y="464" text-anchor="start">NOR × 4</text><text class="label" x="960" y="464" text-anchor="end">16</text><text class="label" x="760" y="498" text-anchor="start">inverters × 2</text><text class="label" x="960" y="498" text-anchor="end">4</text><path class="wire" style="stroke-width:2" d="M760,514 H960"/><text class="total" x="760" y="548" text-anchor="start">total</text><text class="total" x="960" y="548" text-anchor="end">20</text></svg>
