<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="G as all-NAND: the product NAND and final NAND carry output bubbles, the two OR-shape NANDs carry input bubbles; inverters on b, a, e, and the output; 24 transistors">
  <style>
    svg { background: #fff; }
    .title { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #24313f; }
    .label { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 24px; fill: #24313f; }
    .small { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 18px; fill: #64748b; }
    .note { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 17px; fill: #f97316; font-weight: 700; }
    .total { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #24313f; }
    .cost { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #2563eb; }
    .wire { fill: none; stroke: #24313f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .gate { fill: #fff; stroke: #24313f; stroke-width: 4; stroke-linejoin: round; }
    .bub { fill: #fff; stroke: #24313f; stroke-width: 3.5; }
    .hl { fill: none; stroke: #f97316; stroke-width: 3; stroke-dasharray: 7 7; }
    .node { fill: #24313f; }
  </style>
<text class="title" x="36" y="48" text-anchor="start">G all-NAND: ANDs get output bubbles, ORs get input bubbles</text><text class="small" x="36" y="80" text-anchor="start">4 NAND + 4 inverters (b, a, e, the output) = 24 transistors — saves 4</text><text class="label" x="50" y="108" text-anchor="end">a</text><text class="label" x="50" y="158" text-anchor="end">b</text><text class="label" x="50" y="208" text-anchor="end">c</text><text class="label" x="50" y="338" text-anchor="end">d</text><text class="label" x="50" y="388" text-anchor="end">e</text><path class="wire" d="M60,150 H120"/><path class="gate" d="M120,130.0 L160,150 L120,170.0 z"/><circle class="bub" cx="169" cy="150" r="9"/><path class="wire" d="M180,150 H250"/><path class="wire" d="M60,200 H250"/><path class="gate" d="M250,140.0 h55.0 a35.0,35.0 0 0 1 0,70 h-55.0 z"/><circle class="bub" cx="349" cy="175" r="9"/><path class="wire" d="M358,175 H400 V165 H447"/><path class="wire" d="M60,100 H120"/><path class="gate" d="M120,80.0 L160,100 L120,120.0 z"/><circle class="bub" cx="169" cy="100" r="9"/><path class="wire" d="M180,100 H400 V115 H447"/><path class="gate" d="M470,105.0 q45.0,0 100,35.0 q-55.00000000000001,35.0 -100,35.0 q22.0,-35.0 0,-70 z"/><circle class="bub" cx="459" cy="115" r="9"/><circle class="bub" cx="459" cy="165" r="9"/><path class="wire" d="M570,140 H600 V228 H690"/><path class="wire" d="M60,330 H400 V330 H447"/><path class="wire" d="M60,380 H120"/><path class="gate" d="M120,360.0 L160,380 L120,400.0 z"/><circle class="bub" cx="169" cy="380" r="9"/><path class="wire" d="M180,380 H400 V380 H447"/><path class="gate" d="M470,320.0 q45.0,0 100,35.0 q-55.00000000000001,35.0 -100,35.0 q22.0,-35.0 0,-70 z"/><circle class="bub" cx="459" cy="330" r="9"/><circle class="bub" cx="459" cy="380" r="9"/><path class="wire" d="M570,355 H600 V268 H690"/><path class="gate" d="M690,213.0 h55.0 a35.0,35.0 0 0 1 0,70 h-55.0 z"/><circle class="bub" cx="789" cy="248" r="9"/><path class="wire" d="M798,248 H830"/><path class="gate" d="M830,228.0 L870,248 L830,268.0 z"/><circle class="bub" cx="879" cy="248" r="9"/><path class="wire" d="M888,248 H920"/><text class="label" x="932" y="256" text-anchor="start">G</text><ellipse class="hl" cx="405" cy="170" rx="60" ry="26"/><text class="note" x="405" y="220" text-anchor="middle">cancel</text><text class="note" x="330" y="128" text-anchor="middle">bubble wants a′</text><ellipse class="hl" cx="410" cy="330" rx="66" ry="24"/><text class="note" x="410" y="420" text-anchor="middle">d → d′ free</text><text class="note" x="150" y="424" text-anchor="middle">e must arrive clean</text><text class="note" x="858" y="213" text-anchor="middle">output bubble → inverter</text><text class="small" x="760" y="430" text-anchor="start">Transistors</text><text class="label" x="760" y="464" text-anchor="start">NAND × 4</text><text class="label" x="960" y="464" text-anchor="end">16</text><text class="label" x="760" y="498" text-anchor="start">inverters × 4</text><text class="label" x="960" y="498" text-anchor="end">8</text><path class="wire" style="stroke-width:2" d="M760,514 H960"/><text class="total" x="760" y="548" text-anchor="start">total</text><text class="total" x="960" y="548" text-anchor="end">24</text></svg>
