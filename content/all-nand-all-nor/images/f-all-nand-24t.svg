<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="F as all-NAND: the two product NANDs and the final NAND carry output bubbles, the OR-shape NAND carries input bubbles; inverters on a, x, the a-bar-b wire, and the output; 24 transistors">
  <style>
    svg { background: #fff; }
    .title { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #24313f; }
    .label { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 24px; fill: #24313f; }
    .small { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 18px; fill: #64748b; }
    .note { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 17px; fill: #f97316; font-weight: 700; }
    .total { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #24313f; }
    .cost { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #2563eb; }
    .wire { fill: none; stroke: #24313f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .gate { fill: #fff; stroke: #24313f; stroke-width: 4; stroke-linejoin: round; }
    .bub { fill: #fff; stroke: #24313f; stroke-width: 3.5; }
    .hl { fill: none; stroke: #f97316; stroke-width: 3; stroke-dasharray: 7 7; }
    .node { fill: #24313f; }
  </style>
<text class="title" x="36" y="48" text-anchor="start">F all-NAND: ANDs get output bubbles, the OR gets input bubbles</text><text class="small" x="36" y="80" text-anchor="start">4 NAND + 4 inverters (a, x, one leftover bubble, the output) = 24 transistors</text><text class="label" x="50" y="158" text-anchor="end">a</text><text class="label" x="50" y="208" text-anchor="end">b</text><text class="label" x="50" y="308" text-anchor="end">x</text><text class="label" x="50" y="358" text-anchor="end">y</text><text class="label" x="50" y="448" text-anchor="end">c</text><path class="wire" d="M60,150 H120"/><path class="gate" d="M120,130.0 L160,150 L120,170.0 z"/><circle class="bub" cx="169" cy="150" r="9"/><path class="wire" d="M180,150 H250"/><path class="wire" d="M60,200 H250"/><path class="gate" d="M250,140.0 h55.0 a35.0,35.0 0 0 1 0,70 h-55.0 z"/><circle class="bub" cx="349" cy="175" r="9"/><path class="wire" d="M358,175 H420"/><path class="gate" d="M420,155.0 L460,175 L420,195.0 z"/><circle class="bub" cx="469" cy="175" r="9"/><path class="wire" d="M478,175 H560 V265"/><path class="wire" d="M60,300 H120"/><path class="gate" d="M120,280.0 L160,300 L120,320.0 z"/><circle class="bub" cx="169" cy="300" r="9"/><path class="wire" d="M180,300 H250"/><path class="wire" d="M60,350 H250"/><path class="gate" d="M250,290.0 h55.0 a35.0,35.0 0 0 1 0,70 h-55.0 z"/><circle class="bub" cx="349" cy="325" r="9"/><path class="wire" d="M358,325 H400 V370 H447"/><path class="wire" d="M60,440 H400 V420 H447"/><path class="gate" d="M470,360.0 q45.0,0 100,35.0 q-55.00000000000001,35.0 -100,35.0 q22.0,-35.0 0,-70 z"/><circle class="bub" cx="459" cy="370" r="9"/><circle class="bub" cx="459" cy="420" r="9"/><path class="wire" d="M570,395 H600 V305 H690"/><path class="wire" d="M560,265 H690"/><path class="gate" d="M690,250.0 h55.0 a35.0,35.0 0 0 1 0,70 h-55.0 z"/><circle class="bub" cx="789" cy="285" r="9"/><path class="wire" d="M798,285 H830"/><path class="gate" d="M830,265.0 L870,285 L830,305.0 z"/><circle class="bub" cx="879" cy="285" r="9"/><path class="wire" d="M888,285 H920"/><text class="label" x="932" y="293" text-anchor="start">F</text><ellipse class="hl" cx="428" cy="372" rx="52" ry="30"/><text class="note" x="428" y="330" text-anchor="middle">cancel</text><ellipse class="hl" cx="410" cy="432" rx="70" ry="26"/><text class="note" x="410" y="482" text-anchor="middle">c → c′ for free</text><text class="note" x="448" y="140" text-anchor="middle">leftover bubble → inverter</text><text class="note" x="858" y="250" text-anchor="middle">output bubble → inverter</text><text class="small" x="760" y="430" text-anchor="start">Transistors</text><text class="label" x="760" y="464" text-anchor="start">NAND × 4</text><text class="label" x="960" y="464" text-anchor="end">16</text><text class="label" x="760" y="498" text-anchor="start">inverters × 4</text><text class="label" x="960" y="498" text-anchor="end">8</text><path class="wire" style="stroke-width:2" d="M760,514 H960"/><text class="total" x="760" y="548" text-anchor="start">total</text><text class="total" x="960" y="548" text-anchor="end">24</text></svg>
