<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="The debouncer FSMD. IDLE clears C and stays while diff is 0; on diff it goes to WAIT. WAIT adds 1 to C and stays on diff and not tc; on diff-bar it goes back to IDLE; on diff and tc it goes to LOAD. LOAD copies S into Q, clears C, and always returns to IDLE">
  <style>
    text { font-family: Inter, Helvetica, Arial, sans-serif; }
    .label { font-size: 30px; font-weight: 700; fill: #24313f; }
    .small { font-size: 24px; fill: #64748b; }
    .blk   { font-size: 32px; font-weight: 700; fill: #24313f; }
    .ctl   { font-size: 28px; font-weight: 700; fill: #f97316; }
    .wire  { fill: none; stroke: #24313f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .cwire { fill: none; stroke: #f97316; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .gate  { fill: #fff; stroke: #24313f; stroke-width: 4; stroke-linejoin: round; }
    .box   { fill: #f3f6fb; stroke: #24313f; stroke-width: 4; stroke-linejoin: round; }
    .mbox  { fill: #fff4e8; stroke: #f97316; stroke-width: 4; stroke-linejoin: round; }
    .node  { fill: #24313f; }
    .head  { fill: #24313f; }
    .chead { fill: #f97316; }
    .pin   { font-size: 24px; font-weight: 700; fill: #64748b; }
    .cnode { fill: #f97316; }
    .wave  { fill: none; stroke: #24313f; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    .awave { fill: none; stroke: #12866f; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
    .guide { stroke: #c3ccd8; stroke-width: 2; stroke-dasharray: 6 8; }
    .lvl   { stroke: #c3ccd8; stroke-width: 2; stroke-dasharray: 2 10; }
    .bar   { stroke: #24313f; stroke-width: 3; stroke-linecap: round; }
  </style>
<style>.arc0 { fill: none; stroke: #24313f; stroke-width: 4; }.arc1 { fill: none; stroke: #4a6fa5; stroke-width: 5; }.h1 { fill: #4a6fa5; } .lab1 { font-size: 30px; font-weight: 700; fill: #4a6fa5; }.bub { fill: #fff; stroke: #24313f; stroke-width: 4; }.code { font-size: 40px; font-weight: 700; fill: #24313f; }.inbub { font-size: 28px; font-weight: 700; fill: #64748b; }.codeb { font-size: 30px; font-weight: 700; fill: #4a6fa5; }</style><style>.arcA { fill: none; stroke: #12866f; stroke-width: 5; stroke-dasharray: 14 9; } .hA { fill: #12866f; }.labA { font-size: 30px; font-weight: 700; fill: #12866f; }</style><path class="arc0" d="M551.3,353.5 Q499.3,465.9 420.9,528.0"/><polygon class="head" points="405.3,540.4 433.7,534.4 417.6,514.1"/><text x="510.8" y="478.44300146279716" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">diff</text><path class="arc0" d="M368.7,516.5 Q420.7,404.1 499.1,342.0"/><polygon class="head" points="514.7,329.6 486.3,335.6 502.4,355.9"/><text x="328.2" y="413.55699853720284" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">diff</text><line x1="330.2" y1="385.4" x2="403.2" y2="385.4" stroke="#4a6fa5" stroke-width="3" stroke-linecap="round"/><path class="arc0" d="M422.0,600.0 Q590.0,600.0 734.0,600.0"/><polygon class="head" points="754.0,600.0 728.0,587.0 728.0,613.0"/><text x="521.6" y="582.0" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">diff·tc</text><path class="arc0" d="M780.6,539.7 Q688.6,459.8 643.5,372.9"/><polygon class="head" points="634.3,355.2 634.7,384.3 657.8,372.3"/><text class="small" x="731.992178196618" y="453.59011178343246" text-anchor="start">always</text><path class="arc0" d="M672.0,228.2 C764.9,120.6 764.9,419.4 688.4,328.9"/><polygon class="head" points="675.5,313.6 682.4,341.8 702.2,325.1"/><text x="760.1" y="282.2269952498698" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">diff</text><line x1="762.1" y1="254.1" x2="835.2" y2="254.1" stroke="#4a6fa5" stroke-width="3" stroke-linecap="round"/><path class="arc0" d="M248.0,641.8 C155.1,749.4 155.1,450.6 231.6,541.1"/><polygon class="head" points="244.5,556.4 237.6,528.2 217.8,544.9"/><text x="107.9" y="711.7730047501302" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">diff·</text><text x="204.2" y="711.7730047501302" font-size="32" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">tc</text><line x1="206.2" y1="683.6" x2="240.7" y2="683.6" stroke="#4a6fa5" stroke-width="3" stroke-linecap="round"/><circle class="bub" cx="590" cy="270" r="92"/><text class="code" x="590" y="284" text-anchor="middle">IDLE</text><circle class="bub" cx="330" cy="600" r="92"/><text class="code" x="330" y="614" text-anchor="middle">WAIT</text><circle class="bub" cx="850" cy="600" r="92"/><text class="code" x="850" y="614" text-anchor="middle">LOAD</text><path class="wire" d="M410,150 L491.8,204.5"/><polygon class="head" points="510.1,216.7 495.7,191.5 481.3,213.1"/><text class="label" x="310" y="140" text-anchor="start">reset</text><rect x="670" y="130" width="118.3" height="48" rx="10" fill="#fff" stroke="#4a6fa5" stroke-width="3"/><text x="774.3" y="160" text-anchor="end" font-size="30" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">C &#8592; 0</text><rect x="290" y="750" width="190.54" height="48" rx="10" fill="#fff" stroke="#4a6fa5" stroke-width="3"/><text x="466.53999999999996" y="780" text-anchor="end" font-size="30" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">C &#8592; C + 1</text><rect x="700" y="750" width="244.71999999999997" height="48" rx="10" fill="#fff" stroke="#4a6fa5" stroke-width="3"/><text x="930.72" y="780" text-anchor="end" font-size="30" font-weight="700" fill="#4a6fa5" style="font-family: Menlo, monospace">Q &#8592; S, C &#8592; 0</text><text class="small" x="1110" y="40" text-anc