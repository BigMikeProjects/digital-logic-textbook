title: "Gate Technologies and Noise Margin"
description: "What a logic gate's output promises and its input needs (V_OH,min, V_OL,max, V_IH,min, V_IL,max), the noise margins as the gaps between them, and how the margins shrank as the supply came down from 5 V TTL and CMOS to 1.2 V."
