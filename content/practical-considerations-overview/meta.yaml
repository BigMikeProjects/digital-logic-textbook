  01-video.youtube:
    caption: "Video: the decision window around a clock edge — setup and hold time, the timing budget of clock-to-output delay, logic delay and setup time that fixes the slack and the clock speed, and the three ways a change on D can land in the window"
  02-interactive.html:
    caption: "Interactive: drag D's transition across the decision window and watch Q, trade clock period against logic depth on a to-scale timing budget with live slack and maximum frequency, then fire an unsynchronized input at random moments and count how often it lands in the window"
