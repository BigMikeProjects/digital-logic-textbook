title: "Practical Considerations Overview"
description: "A real flip-flop needs its D input to hold still for a short decision window around the clock edge. Setup time, hold time, clock-to-output delay and logic delay set the slack and the maximum clock speed, and there are three ways a change can land in the window."
chapter: sequential-logic
section: practical-considerations
order: 40400

